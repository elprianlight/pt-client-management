  --sh-card:0 1px 1px rgba(255,255,255,.12) inset,0 8px 18px -10px rgba(0,0,0,.6);
  --sh-big:0 1px 1px rgba(255,255,255,.16) inset,0 -1px 2px rgba(0,0,0,.5) inset,0 18px 40px -12px rgba(0,0,0,.7),0 0 26px -10px rgba(52,211,153,.28);
  --sh-btn:0 1px 0 rgba(255,255,255,.6) inset,0 -3px 0 rgba(0,60,40,.4) inset,0 0 24px rgba(52,211,153,.5),0 8px 20px rgba(0,0,0,.55);
  --press:0 2px 6px rgba(0,0,0,.45) inset,0 1px 0 rgba(255,255,255,.06);
}
/* --- merah · terang --- */
:root[data-pal="red"][data-theme="light"]{
  --brand:#d23a2a;--brand-2:#b62e20;--neon:#ef4a37;--accent:#f59e0b;--glow:rgba(240,80,60,.36);--glow-solid:#ef4a37;
  --bg:#fbf1ec;--surface:#ffffff;--elev:#fdf6f2;--subtle:#f6e5dd;
  --line:#efd8cd;--line-2:#e3bfb0;
  --ink:#2a1713;--ink-2:#6a514a;--ink-3:#a58b82;
  --ok:#27864a;--ok-bg:#e0f3e7;--warn:#a8730a;--warn-bg:#fdf1dc;--bad:#c0392b;--bad-bg:#fde8e5;--info:#3b6fb6;--info-bg:#fdebe6;
  --grad:linear-gradient(180deg,#ff7a63 0%,#ef4a37 40%,#d23a2a 100%);
  --hero:linear-gradient(135deg,#8f1f14 0%,#d23a2a 58%,#f2704f 100%);
  --grid:rgba(210,58,42,.06);
  --b1:rgba(240,80,60,.20);--b2:rgba(245,158,11,.16);--b3:rgba(210,58,42,.10);
  --card-bg:linear-gradient(160deg,rgba(255,255,255,.96),rgba(253,242,237,.82));
  --dock-bg:linear-gradient(180deg,rgba(255,255,255,.88),rgba(252,236,229,.80));
  --gl-lo:rgba(90,20,10,.10);
  --sh-card:0 1px 0 rgba(255,255,255,.9) inset,0 6px 16px -10px rgba(150,50,30,.28);
  --sh-big:0 1px 0 rgba(255,255,255,.9) inset,0 16px 34px -12px rgba(150,50,30,.24);
  --sh-btn:0 1px 0 rgba(255,255,255,.5) inset,0 -3px 0 rgba(110,20,10,.3) inset,0 10px 22px -6px var(--glow),0 3px 6px rgba(150,40,20,.25);
  --press:0 2px 5px rgba(150,50,30,.10) inset,0 1px 0 rgba(255,255,255,.95);
  --fx1:#ff7a63;--fx2:#f59e0b;--fx3:#fecaca;--on-grad-sh:0 1px 1px rgba(110,20,10,.45);
}
/* --- merah · gelap --- */
:root[data-pal="red"][data-theme="dark"]{
  --brand:#ee5a45;--brand-2:#ff6b57;--neon:#ff6b57;--accent:#f0b43c;--glow:rgba(255,90,70,.45);--glow-solid:#ff5a45;
  --bg:#0e0908;--surface:#1a1210;--elev:#221715;--subtle:#2b1d1a;
  --line:#3a2622;--line-2:#54352f;
  --ink:#fff1ec;--ink-2:#b99d94;--ink-3:#7d645c;
  --ok:#4ccf7f;--ok-bg:#12331f;--warn:#f0b43c;--warn-bg:#3a2d12;--bad:#ff8f84;--bad-bg:#40201f;--info:#7aa8ee;--info-bg:#3a1c18;
  --grad:linear-gradient(180deg,#ff8c78 0%,#ff5a45 42%,#e8402f 100%);
  --hero:linear-gradient(135deg,#4a120b 0%,#8f1f14 55%,#c9372a 100%);
  --on-grad:#2a0a05;--on-grad-sh:0 1px 0 rgba(255,255,255,.3);
  --grid:rgba(255,90,70,.06);
  --b1:rgba(255,90,70,.18);--b2:rgba(240,180,60,.10);--b3:rgba(255,90,70,.08);
  --card-bg:linear-gradient(160deg,rgba(40,22,19,.88),rgba(24,13,11,.82));
  --dock-bg:linear-gradient(180deg,rgba(38,21,18,.88),rgba(22,12,10,.90));
  --sh-big:0 1px 1px rgba(255,255,255,.14) inset,0 -1px 2px rgba(0,0,0,.5) inset,0 18px 40px -12px rgba(0,0,0,.7),0 0 26px -10px rgba(255,90,70,.28);
  --sh-btn:0 1px 0 rgba(255,255,255,.5) inset,0 -3px 0 rgba(90,20,10,.4) inset,0 0 24px rgba(255,90,70,.45),0 8px 20px rgba(0,0,0,.55);
  --fx1:#ff8c78;--fx2:#f0b43c;--fx3:#fecaca;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background-color:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(900px 560px at 88% -8%,var(--b2),transparent 60%),radial-gradient(800px 560px at -8% 28%,var(--b1),transparent 58%),radial-gradient(900px 700px at 50% 112%,var(--b3),transparent 65%)}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4,.btn,.chip,.badge,.kpi .v,.bnav a,.seg button{font-family:var(--font-h)}
h1,h2,h3{letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand);text-decoration:none}
[hidden]{display:none!important}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}.small{font-size:12.5px}.num{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}

/* bentuk melayang (latar) */
.nb-shapes{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.nb-shapes i{position:absolute;display:block;border-radius:50%;opacity:.3;animation:nbf 18s ease-in-out infinite;background:radial-gradient(circle at 32% 28%,#fff 0,rgba(255,255,255,0) 34%),radial-gradient(circle at 50% 50%,var(--c,var(--neon)),transparent 70%)}
.nb-shapes i:nth-child(1){width:180px;height:180px;left:-50px;top:18%}
.nb-shapes i:nth-child(2){--c:var(--accent);width:120px;height:120px;right:-30px;top:44%;animation-delay:-6s;animation-duration:22s}
.nb-shapes i:nth-child(3){--c:#a3e635;width:90px;height:90px;left:62%;top:8%;animation-delay:-11s;animation-duration:16s}
.nb-shapes i:nth-child(4){--c:#8b5cf6;width:140px;height:140px;left:6%;bottom:-40px;animation-delay:-3s;animation-duration:26s;opacity:.2}
:root[data-pal="red"] .nb-shapes i:nth-child(3){--c:#f59e0b}
:root[data-pal="red"] .nb-shapes i:nth-child(4){--c:#fb7185}
@keyframes nbf{0%,100%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(22px,-34px,0) scale(1.08)}66%{transform:translate3d(-16px,20px,0) scale(.94)}}

/* shell */
#app{min-height:100vh}
.shell{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:calc(var(--top-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--line);box-shadow:0 8px 24px -16px rgba(4,60,40,.3)}
.top .logo{width:34px;height:34px;border-radius:11px}
.top h1{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view{width:100%;max-width:940px;margin:0 auto;padding:14px 16px calc(var(--nav-h) + 44px + env(safe-area-inset-bottom))}
.view.enter>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.view.enter>*:nth-child(2){animation-delay:.05s}.view.enter>*:nth-child(3){animation-delay:.1s}.view.enter>*:nth-child(4){animation-delay:.15s}.view.enter>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:perspective(900px) translateY(18px) rotateX(-8deg)}to{opacity:1;transform:none}}
/* dock melayang */
.bnav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:7px;border-radius:26px;background:var(--dock-bg);border:1px solid color-mix(in srgb,var(--brand) 22%,var(--line));backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 1px 0 var(--gl-hi) inset,0 -1px 0 var(--gl-lo) inset,0 22px 44px -10px rgba(4,60,40,.38),0 0 30px -12px var(--glow)}
.bnav a{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:19px;color:var(--ink-2);font-size:10.5px;font-weight:600;transition:transform .25s cubic-bezier(.2,.9,.3,1.3),background .2s,color .2s,box-shadow .25s}
.bnav a .ic{transition:transform .25s cubic-bezier(.2,.9,.3,1.5),filter .25s}
.bnav a.on{transform:translateY(-6px);padding-bottom:9px;background:var(--grad);color:var(--on-grad);text-shadow:var(--on-grad-sh);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 -3px 0 rgba(0,60,40,.25) inset,0 14px 22px -8px var(--glow),0 0 0 4px color-mix(in srgb,var(--bg) 70%,transparent)}
.bnav a.on .ic{transform:scale(1.15);filter:drop-shadow(0 3px 3px rgba(0,40,28,.35))}
.bnav a:active{transform:scale(.94)}
@media(min-width:900px){
  .side{display:flex;flex-direction:column;gap:6px;width:250px;flex:none;position:sticky;top:0;height:100vh;padding:20px 14px;background:var(--dock-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-right:1px solid var(--line);box-shadow:20px 0 50px -30px rgba(4,60,40,.3)}
  .side .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-family:var(--font-h);font-weight:700;font-size:16px}
  .side .brand img{width:40px;height:40px;border-radius:12px}
  .side a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;color:var(--ink-2);font-weight:700;border:1px solid transparent;transition:transform .2s,background .2s,box-shadow .2s}
  .side a:hover{background:var(--elev);transform:translateX(3px)}
  .side a.on{background:var(--grad);color:var(--on-grad);text-shadow:var(--on-grad-sh);box-shadow:var(--sh-btn);transform:translateX(5px)}
  .side .grow{flex:1}
  .bnav{display:none}
  .view{padding:22px 28px 80px}
  .top .logo{display:none}
}

/* kartu kaca */
.card,.kpi,.item,.seg,.search input,.fld input,.fld select,.fld textarea,.inp{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card,.kpi,.item{position:relative;background:var(--card-bg);border:1px solid color-mix(in srgb,var(--brand) 16%,var(--line));box-shadow:var(--sh-card);transform-style:preserve-3d;will-change:transform;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.card::after,.kpi::after,.item::after,.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(220px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.5),transparent 60%)}
:root[data-theme="dark"] .card::after,:root[data-theme="dark"] .kpi::after,:root[data-theme="dark"] .item::after{background:radial-gradient(220px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--neon) 22%,transparent),transparent 60%)}
.tilting::after{opacity:1}
.card{border-radius:var(--r-lg);padding:16px}
.card+.card,.stack>*+*{margin-top:12px}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.gap-s{gap:6px}.gap-l{gap:16px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 2px 14px}
.page-h h2{font-size:21px;font-weight:700}.page-h p{color:var(--ink-2);font-size:12.5px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec-h h3{font-size:15px;font-weight:700}
.empty{padding:30px 16px;text-align:center;color:var(--ink-2);border:1.5px dashed var(--line-2);border-radius:var(--r-lg);background:var(--surface)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:18px 20px;color:#fff;background:var(--hero);min-height:150px;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 -2px 0 rgba(0,40,28,.25) inset,0 24px 50px -16px var(--glow),0 8px 18px rgba(4,60,40,.25);transform-style:preserve-3d;transition:transform .2s ease-out}
.hero:before{content:"";position:absolute;right:-50px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.hero::after{opacity:1;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 38%),radial-gradient(260px circle at var(--mx,70%) var(--my,0%),rgba(255,255,255,.26),transparent 62%)}
.hero .fx3d{position:absolute;right:-10px;top:-6px;width:170px;height:100%;min-height:150px;pointer-events:none}
.hero .lbl{font-size:11.5px;font-weight:600;opacity:.88;letter-spacing:.3px}
.hero h2{font-size:25px;font-weight:700;margin:4px 0 6px;max-width:68%;text-shadow:0 2px 10px rgba(0,40,28,.3)}
.hero p{opacity:.92;font-size:13px;max-width:68%}
.fx3d{position:relative}.fx3d canvas{display:block;width:100%!important;height:100%!important}
.fx-poster{position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--neon) 55%,#fff) 0,color-mix(in srgb,var(--neon) 28%,transparent) 34%,transparent 64%);filter:blur(2px)}

/* kpi + orb warna */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{border-radius:16px;padding:13px 14px;min-width:0;display:block;color:inherit;overflow:hidden}
.kpi::before{content:"";position:absolute;right:12px;top:12px;width:16px;height:16px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95) 0,rgba(255,255,255,0) 28%),radial-gradient(circle at 35% 30%,var(--ka,#5eead4),var(--kb,#14b8a6) 55%,var(--kd,#0f766e));box-shadow:0 -3px 5px -2px rgba(0,0,0,.35) inset,0 8px 12px -5px var(--kb,#14b8a6)}
.kpis .kpi:nth-child(4n+1){--ka:#99f6e4;--kb:#14b8a6;--kd:#0f766e}
.kpis .kpi:nth-child(4n+2){--ka:#bfdbfe;--kb:#3b82f6;--kd:#1d4ed8}
.kpis .kpi:nth-child(4n+3){--ka:#fde68a;--kb:#f59e0b;--kd:#b45309}
.kpis .kpi:nth-child(4n){--ka:#ddd6fe;--kb:#8b5cf6;--kd:#5b21b6}
.kpi .k{font-size:11.5px;font-weight:600;color:var(--ink-2);padding-right:24px}
.kpi .v{font-size:17px;font-weight:700;margin:3px 0 1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .s{font-size:11.5px;color:var(--ink-3)}
a.kpi:active,button.kpi:active{transform:translateY(1px) scale(.985)}

/* daftar */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;border-radius:16px;padding:12px 14px;width:100%;text-align:left;color:inherit}
a.item:hover,button.item:hover{border-color:color-mix(in srgb,var(--brand) 50%,var(--line))}
a.item:active,button.item:active{transform:translateY(1px) scale(.985)}
.item .t{font-weight:700;font-size:14px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .d{font-size:12px;color:var(--ink-2);margin-top:2px}
.item .r{text-align:right;flex:none}
/* avatar: atom 3D */
.avatar{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:13.5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);
  background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.95) 0,rgba(255,255,255,0) 22%),radial-gradient(circle at 34% 30%,var(--a,#6ee7b7) 0,var(--b,#10b981) 52%,var(--d,#047857) 100%);
  box-shadow:0 -5px 9px -3px rgba(0,0,0,.4) inset,0 3px 5px rgba(255,255,255,.35) inset,0 10px 16px -6px var(--b,#10b981),0 3px 5px rgba(0,30,20,.25);margin:3px 5px 3px 2px}
.avatar::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--b,#10b981) 45%,transparent);pointer-events:none}
.avatar::after{content:"";position:absolute;top:-10.5px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff,var(--o,#22d3ee) 55%,rgba(0,0,0,.4));box-shadow:0 2px 5px var(--o,#22d3ee);transform-origin:50% calc(21px + 10.5px)}
.item:hover .avatar::before,a.item:focus-visible .avatar::before{animation:orbit 6s linear infinite}
.item:hover .avatar::after{animation:orbit 6s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.avatar.c1{--a:#6ee7b7;--b:#10b981;--d:#047857;--o:#22d3ee}
.avatar.c2{--a:#a5f3fc;--b:#22d3ee;--d:#0e7490;--o:#a78bfa}
.avatar.c3{--a:#ddd6fe;--b:#8b5cf6;--d:#5b21b6;--o:#34d399}
.avatar.c4{--a:#fde68a;--b:#f59e0b;--d:#b45309;--o:#22d3ee}
.avatar.c5{--a:#fecdd3;--b:#f43f5e;--d:#be123c;--o:#fbbf24}
.avatar.c6{--a:#bfdbfe;--b:#3b82f6;--d:#1d4ed8;--o:#34d399}
.avatar.mute{--a:#d1d5db;--b:#9ca3af;--d:#6b7280;--o:#9ca3af;filter:saturate(.7)}
.avatar.mute::before{opacity:.5}
.dot{width:8px;height:36px;border-radius:5px;flex:none;background:var(--ink-3);box-shadow:0 0 12px currentColor,0 1px 0 rgba(255,255,255,.5) inset}
.dot.completed{background:linear-gradient(180deg,#6ee7b7,#059669);color:#10b981}
.dot.scheduled{background:linear-gradient(180deg,#93c5fd,#2563eb);color:#3b82f6}
.dot.check_in{background:linear-gradient(180deg,#fde68a,#d97706);color:#f59e0b}
.dot.cancelled,.dot.no_show{background:linear-gradient(180deg,#fda4af,#e11d48);color:#f43f5e}
.dot.rescheduled{background:linear-gradient(180deg,#d1d5db,#6b7280);color:#9ca3af}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;background:var(--elev);color:var(--ink-2);border:1px solid var(--line)}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}.badge.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.progress{height:8px;border-radius:99px;background:var(--subtle);overflow:hidden;box-shadow:var(--press);margin-top:8px}
.progress>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--neon),var(--accent));box-shadow:0 0 10px var(--glow);position:relative}
.progress>i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);animation:sheen 2.6s ease-in-out infinite}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.progress.warn>i{background:linear-gradient(90deg,#fbbf24,#d97706);box-shadow:0 0 10px #fbbf24}.progress.ok>i{background:linear-gradient(90deg,#6ee7b7,#059669)}

/* kontrol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:14px;border:1px solid var(--line-2);background:var(--card-bg);font-weight:700;font-size:13.5px;color:var(--ink);box-shadow:0 1px 0 var(--gl-hi) inset,0 -2px 0 var(--gl-lo) inset,0 6px 14px -8px rgba(5,80,56,.35);transition:transform .12s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gl-hi) inset,0 1px 0 var(--gl-lo) inset}
.btn.primary{background:var(--grad);border-color:rgba(0,60,40,.35);color:var(--on-grad);text-shadow:var(--on-grad-sh);box-shadow:var(--sh-btn)}

    const s = openSheet({ title, body: `<p class="muted">${esc(message)}</p>`, footer: `<button class="btn" data-close>Batal</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(okText)}</button>` });
    s.el.addEventListener('click', e => { if (e.target.closest('[data-ok]')) { s.close(); res(true); } else if (e.target.closest('[data-close]')) res(false); });
  });
}
/** Jalankan aksi async dengan tombol terkunci + toast hasil. */
async function act(btn, fn, okMsg) {
  if (btn) btn.disabled = true;
  try { const r = await fn(); if (okMsg) toast(okMsg); return { ok: true, data: r }; }
  catch (e) { toast(errMsg(e), 'err'); return { ok: false, error: e }; }
  finally { if (btn) btn.disabled = false; }
}
const rpcRemote = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; };
/** Mode langsung: operasi tabel (tanpa fungsi database app_*). Lihat direct.js */

  document.documentElement.setAttribute('data-theme', pref === 'auto' ? sys : pref);
  const m = document.querySelector('meta[name=theme-color]'); if (m) { const dk = (pref === 'auto' ? sys : pref) === 'dark', rd = getPalPref() === 'red'; m.content = dk ? (rd ? '#0e0908' : '#06150f') : (rd ? '#fbf1ec' : '#effaf3'); }
}

'use strict';
/* ======================= Mode langsung: operasi tabel tanpa fungsi database =======================
   Dipakai bila database belum memiliki fungsi app_* (migrasi 0200). Nomor kuitansi, status bayar, dan
   used_sessions diisi oleh trigger yang sudah ada di database. Aturan peran dijaga di aplikasi. */
const need = r => { if (r.error) throw r.error; return r.data; };
const one = r => { const d = need(r); if (!d || !d.length) throw new Error('Data tidak ditemukan atau tidak bisa diubah'); return d[0]; };
const nowIso = () => new Date().toISOString();
const need_admin = m => { if (!isAdmin()) throw new Error(m || 'Hanya Admin yang dapat melakukan ini'); };
const need_writer = () => { if (!canWrite()) throw new Error('Hanya Admin atau PT yang dapat melakukan ini'); };
const monthTag = m => `Billing Pascabayar: ${m}`;
const rpFmt = n => 'Rp ' + Math.round(num(n)).toLocaleString('id-ID');
const nn = v => (v === '' || v === undefined) ? null : v;
const ownSession = async id => {
  const s = one(await sb.from('workout_sessions').select('*').eq('id', id).limit(1));
  if (isPT() && s.trainer_id !== S.trainerId) throw new Error('Sesi ini bukan milik Anda');
  return s;
};
async function freshPaid(pkgId, month) {
  const t = need(await sb.from('pt_transactions').select('amount,kind,payment_status,voided_at,notes').eq('package_id', pkgId));
  const live = t.filter(x => !x.voided_at && (x.payment_status === 'paid' || x.payment_status === 'partial'));
  if (month) return live.filter(x => (x.notes || '').includes(monthTag(month))).reduce((a, x) => a + num(x.amount), 0);
  return live.reduce((a, x) => a + (x.kind === 'refund' ? -num(x.amount) : num(x.amount)), 0);
}
async function insertPayment(pkgId, amount, notes, month) {
  const p = one(await sb.from('pt_packages').select('*').eq('id', pkgId).limit(1));
  const post = isPostpaid(p);
  if (!(amount > 0)) throw new Error('Jumlah harus lebih dari 0');
  if (post && !month) throw new Error('Pilih bulan tagihan pascabayar');
  if (!post) {
    const out = Math.max(num(p.total_price) - await freshPaid(pkgId), 0);
    if (amount > out) throw new Error(`Pembayaran melebihi sisa tagihan (sisa ${rpFmt(out)})`);
  } else {
    const ses = need(await sb.from('workout_sessions').select('scheduled_at,status,counts_toward_balance').eq('package_id', pkgId));
    const n = ses.filter(s => ym(s.scheduled_at) === month && isCounted(s)).length;
    const out = Math.max(n * num(p.price_per_session) - await freshPaid(pkgId, month), 0);
    if (amount > out) throw new Error(`Pembayaran melebihi tagihan bulan ini (sisa ${rpFmt(out)})`);
  }
  const noteTxt = [post ? monthTag(month) : null, nn(notes)].filter(Boolean).join(' · ') || null;
  const row = one(await sb.from('pt_transactions').insert({ package_id: p.id, trainer_id: p.trainer_id, client_id: p.client_id, amount, payment_status: 'paid', payment_date: nowIso(), notes: noteTxt, kind: 'payment', created_by: S.me.id }).select('id,receipt_number'));
  return { transaction_id: row.id, receipt_number: row.receipt_number };
}

'use strict';
/* ======================= 3D: satu kanvas WebGL bersama, tiga tingkat kualitas ======================= */
const FX = (() => {
  const KEY = 'elp.3d';
  const TIERS = {
    high:   { label: 'Tinggi', dpr: 1.75, aa: true,  sparks: 60, seg: 48, phys: true,  extras: true,  webgl: true },
    medium: { label: 'Sedang', dpr: 1.25, aa: false, sparks: 18, seg: 24, phys: false, extras: true,  webgl: true },
    low:    { label: 'Hemat',  dpr: 1,    aa: false, sparks: 0,  seg: 12, phys: false, extras: false, webgl: false },
  };
  const FPS_FLOOR = 40;
  let mode = 'auto', detected = null, downgraded = null;
  try { const m = localStorage.getItem(KEY); if (['auto', 'high', 'medium', 'low'].includes(m)) mode = m; } catch { }

  function detect() {
    try {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return 'low';
      if (navigator.connection && navigator.connection.saveData) return 'low';
      if (!window.THREE) return 'low';
      const c = document.createElement('canvas');
      const gl = c.getContext('webgl2') || c.getContext('webgl');
      if (!gl) return 'low';
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      const rd = dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)) : '';
      const lose = gl.getExtension('WEBGL_lose_context'); if (lose) lose.loseContext();
      if (/swiftshader|llvmpipe|software/i.test(rd)) return 'low'; // tanpa GPU
      const cores = navigator.hardwareConcurrency || 4, mem = navigator.deviceMemory || 4, coarse = matchMedia('(pointer: coarse)').matches;
      let score = 0; if (cores >= 8) score++; if (mem >= 8) score++; if (!coarse) score++; if (cores >= 6) score++;
      if (score >= 3) return 'high';
      if (score >= 1 && cores >= 4) return 'medium';
      return 'low';
    } catch { return 'low'; }
  }
  const tier = () => { if (mode !== 'auto') return mode; if (!detected) detected = detect(); return downgraded || detected; };
  const cfg = () => TIERS[tier()];

  let renderer = null, scene = null, camera = null, host = null, variant = null, builtFor = null;
  let rafId = 0, visible = true, io = null, parts = null, group = null, ring = null, ptr = { x: 0, y: 0 }, tNow = 0;
  let fps = { frames: 0, t: 0, warm: 0, slow: 0, last: 0 };

  function disposeScene() {
    if (!scene) return;
    scene.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose()); });
    scene = null; group = null; ring = null; parts = null; builtFor = null;
  }
  function destroyRenderer() {
    cancelAnimationFrame(rafId); rafId = 0; disposeScene();
    if (renderer) { renderer.dispose(); if (renderer.domElement.parentNode) renderer.domElement.remove(); renderer = null; }
  }
  const mat = (c, o = {}) => { const k = cfg(); return k.phys ? new THREE.MeshPhysicalMaterial({ color: c, metalness: .75, roughness: .28, clearcoat: 1, clearcoatRoughness: .2, ...o }) : new THREE.MeshStandardMaterial({ color: c, metalness: .35, roughness: .5, ...o }); };

  function build(v) {
    disposeScene();
    const k = cfg(); const T = THREE;
    scene = new T.Scene();
    camera = new T.PerspectiveCamera(40, 1, .1, 50); camera.position.set(0, .1, 6.4);
    scene.add(new T.AmbientLight(0xffffff, .8));
    const d = new T.DirectionalLight(0xffffff, 2.2); d.position.set(4, 5, 5); scene.add(d);
    const accentHex = (() => { try { const c = getComputedStyle(document.documentElement).getPropertyValue('--glow-solid').trim(); return c ? new T.Color(c).getHex() : 0xee5a45; } catch { return 0xee5a45; } })();
    const p = new T.PointLight(accentHex, k.phys ? 22 : 12, 30); p.position.set(-4, -1, 3); scene.add(p);
    group = new T.Group();
    const red = accentHex, steel = 0xb9b2ad, dark = 0x2b2623;
    if (v === 'kettlebell') {
      const body = new T.Mesh(new T.SphereGeometry(1.15, k.seg, k.seg), mat(red)); body.position.y = -.35; group.add(body);
      const handle = new T.Mesh(new T.TorusGeometry(.62, .17, Math.max(8, k.seg / 2), k.seg), mat(dark)); handle.position.y = 1.0; group.add(handle);
      const base = new T.Mesh(new T.CylinderGeometry(.7, .8, .18, k.seg), mat(dark)); base.position.y = -1.42; group.add(base);
    } else {
      const bar = new T.Mesh(new T.CylinderGeometry(.13, .13, 4.4, k.seg), mat(steel)); bar.rotation.z = Math.PI / 2; group.add(bar);
      [-1, 1].forEach(s => {
        [[.0, 1.25, .42], [.48, .95, .36], [.88, .68, .3]].forEach(([off, r, th], i) => {
          const m = new T.Mesh(new T.CylinderGeometry(r, r, th, k.seg), mat(i === 0 ? red : (i === 1 ? dark : steel))); m.rotation.z = Math.PI / 2; m.position.x = s * (1.18 + off + (i ? .35 * i : 0)); group.add(m);
        });
      });
      group.rotation.set(.3, -.5, .25);
    }
    scene.add(group);
    if (k.extras) { ring = new T.Mesh(new T.TorusGeometry(2.5, .018, 8, 96), new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .35 })); ring.rotation.x = 1.2; scene.add(ring); }
    if (k.sparks) {
      const g = new T.BufferGeometry(); const a = new Float32Array(k.sparks * 3);
      for (let i = 0; i < a.length; i += 3) { a[i] = (Math.random() - .5) * 8; a[i + 1] = (Math.random() - .5) * 5; a[i + 2] = (Math.random() - .5) * 3; }
      g.setAttribute('position', new T.BufferAttribute(a, 3));
      parts = new T.Points(g, new T.PointsMaterial({ color: 0xffd2c6, size: .06, transparent: true, opacity: .7 })); scene.add(parts);
    }
    builtFor = v + ':' + tier();
  }

  function size() {
    if (!renderer || !host) return;
    const w = host.clientWidth || 200, h = host.clientHeight || 160;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    const fit = Math.min(1, (w / h) / 1.25); camera.position.z = 6.4 / Math.max(.55, fit);
  }

  function frame(ts) {
    rafId = requestAnimationFrame(frame);
    if (!renderer || !host || !host.isConnected) { stop(); return; }
    if (document.hidden || !visible) { fps.last = 0; return; }
    const dt = fps.last ? (ts - fps.last) / 1000 : 0; fps.last = ts;
    tNow += dt;
    if (group) {
      group.rotation.y += dt * .5; group.position.y = Math.sin(tNow * 1.4) * .12;
      const bx = variant === 'kettlebell' ? 0 : .3;
      group.rotation.x += ((bx + ptr.y * .4) - group.rotation.x) * Math.min(1, dt * 4);
    }
    if (ring) ring.rotation.z += dt * .3;
    if (parts) parts.rotation.y += dt * .05;
    renderer.render(scene, camera);
    // pantau fps (jendela 2 dtk; jendela pertama = pemanasan)
    if (dt > 0 && dt < .25) {
      fps.frames++; fps.t += dt;
      if (fps.t >= 2) {
        const f = fps.frames / fps.t; fps.frames = 0; fps.t = 0;
        if (fps.warm < 1) fps.warm++;
        else { fps.slow = f < FPS_FLOOR ? fps.slow + 1 : 0; if (fps.slow >= 2) { fps.slow = 0; downgrade(); } }
      }
    }
  }
  function start() { if (!rafId) { fps.last = 0; rafId = requestAnimationFrame(frame); } }
  function stop() { cancelAnimationFrame(rafId); rafId = 0; }

  function downgrade() {
    if (mode !== 'auto') return;
    const cur = downgraded || detected;
    const next = cur === 'high' ? 'medium' : 'low';
    if (cur === 'low') return;
    downgraded = next; fps = { frames: 0, t: 0, warm: 0, slow: 0, last: 0 };
    refresh();
  }

  function poster(h) { h.innerHTML = '<div class="fx-poster"></div>'; }
  function attach(el, v) {
    detach();
    host = el; variant = v || 'dumbbell';
    if (!host) return;
    if (!cfg().webgl || !window.THREE) { poster(host); host = null; destroyRenderer(); return; }
    try {
      const k = cfg();
      const needNew = !renderer || renderer.__aa !== k.aa;
      if (needNew) { destroyRenderer(); renderer = new THREE.WebGLRenderer({ antialias: k.aa, alpha: true, powerPreference: k.phys ? 'high-performance' : 'default' }); renderer.__aa = k.aa; }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, k.dpr));
      if (builtFor !== variant + ':' + tier()) build(variant);
      host.innerHTML = ''; host.appendChild(renderer.domElement);
      size();
      io = new IntersectionObserver(([e]) => { visible = e.isIntersecting; }, { threshold: 0 }); io.observe(host);
      visible = true; start();
    } catch (e) { console.warn('3D tidak tersedia:', e); poster(host); host = null; }
  }
  function detach() { stop(); if (io) { io.disconnect(); io = null; } host = null; }
  function refresh() { if (host) attach(host, variant); }

  window.addEventListener('resize', () => size());
  window.addEventListener('pointermove', e => { ptr.x = e.clientX / innerWidth - .5; ptr.y = e.clientY / innerHeight - .5; }, { passive: true });
  document.addEventListener('visibilitychange', () => { fps.last = 0; });

  return {
    attach, detach, refresh, tier, cfg,
    mode: () => mode,
    setMode(m) { mode = m; downgraded = null; try { localStorage.setItem(KEY, m); } catch { } refresh(); },
    label: () => TIERS[tier()].label,
    TIERS,
  };
})();

const ORDER = { users: 'created_at', trainers: 'created_at', clients: 'created_at', packages: 'created_at', sessions: 'scheduled_at', trx: 'created_at', banks: 'created_at', reports: 'created_at' };

/** Ambil seluruh baris (halaman 1000) dengan urutan stabil. */
async function fetchAll(table, orderCol) {
  let out = [], from = 0;
  for (; ;) {
    const { data, error } = await sb.from(table).select('*').order(orderCol, { ascending: true }).order('id', { ascending: true }).range(from, from + 999);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < 1000) break;
    from += 1000;
  }
  return out;
}
function indexAll() {
  M.user = Object.fromEntries(S.users.map(x => [x.id, x]));
  M.trainer = Object.fromEntries(S.trainers.map(x => [x.id, x]));
  M.client = Object.fromEntries(S.clients.map(x => [x.id, x]));
  M.pkg = Object.fromEntries(S.packages.map(x => [x.id, x]));
  M.trxById = Object.fromEntries(S.trx.map(x => [x.id, x]));
  M.sessById = Object.fromEntries(S.sessions.map(x => [x.id, x]));
}
/** Muat ulang tabel tertentu (atau semua). */
async function reload(...keys) {
  const ks = keys.length ? keys : Object.keys(TABLES);
  const raw = {};
  await Promise.all(ks.map(async k => { raw[k] = (k === 'reports' && isClient()) ? [] : await fetchAll(TABLES[k], ORDER[k]); }));
  if (S.me) {
    if (raw.trainers) S.trainerId = (raw.trainers.find(t => t.user_id === S.me.id) || {}).id || null;
    if (raw.clients) S.clientId = (raw.clients.find(c => c.user_id === S.me.id) || {}).id || null;
  }
  const ownTrainer = isClient() && S.clientId && raw.clients ? (raw.clients.find(c => c.id === S.clientId) || {}).trainer_id : (isClient() ? (S.clients.find(c => c.id === S.clientId) || {}).trainer_id : null);
  // RLS belum aktif di database: batasi data per peran di sisi aplikasi
  const scope = (k, rows) => {
    if (isAdmin() || !S.me) return rows;
    const tid = isPT() ? S.trainerId : ownTrainer;
    if (k === 'trainers') return rows.filter(r => r.id === tid);
    if (k === 'clients') return rows.filter(r => isPT() ? r.trainer_id === S.trainerId : r.id === S.clientId);
    if (k === 'banks') return rows.filter(r => r.trainer_id === tid);
    if (['packages', 'sessions', 'trx', 'reports'].includes(k)) return rows.filter(r => isPT() ? r.trainer_id === S.trainerId : r.client_id === S.clientId);
    return rows;
  };
  for (const k of ks) S[k] = scope(k, raw[k]);
  if (raw.reports) S.reports = S.reports.map(r => ({ ...r, proof_path: r.proof_url, period_month: ((r.notes || '').match(/Billing Pascabayar: (\d{4}-\d{2})/) || [])[1] || null, notes: (r.notes || '').replace(/Billing Pascabayar: \d{4}-\d{2}\s*/, '').trim() || null }));
  if (raw.users && S.me && !isAdmin()) {
    const ids = new Set([S.me.id, ...S.clients.map(c => c.user_id), ...S.trainers.map(t => t.user_id)]);
    S.users = S.users.filter(u => ids.has(u.id));
  }
  indexAll();
}

/* ---------- autentikasi ---------- */
const usernameToEmail = u => String(u || '').trim().toLowerCase() + '@pt.local';
async function login(username, password) {
  const { error } = await sb.auth.signInWithPassword({ email: usernameToEmail(username), password });
  if (error) throw new Error(/invalid/i.test(error.message) ? 'Username atau password salah' : error.message);
}
async function logout() { try { await sb.auth.signOut(); } catch { } S.loaded = false; S.me = null; location.hash = '#/login'; location.reload(); }
/** Muat profil + semua data. Mengembalikan false bila belum login / akun tidak aktif. */
async function bootSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return false;
  const { data: me, error } = await sb.from('users').select('*').eq('id', session.user.id).maybeSingle();
  if (error) throw error;
  if (!me || !me.is_active) { await sb.auth.signOut(); throw new Error('Akun tidak terdaftar atau tidak aktif. Hubungi Admin.'); }
  S.me = me; S.role = me.role;
  await reload();
  S.loaded = true;
  return true;
}
/** Buat akun login baru memakai klien sementara (tidak mengganti sesi Admin/PT yang aktif). */
async function createAuthAccount(username, password) {
  const tmp = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'elp-tmp-' + uuid() } });
  const email = usernameToEmail(username);
  const { data, error } = await tmp.auth.signUp({ email, password });
  if (error) {
    if (/already|registered|exists/i.test(error.message)) {
      // percobaan ulang setelah gagal di tengah jalan: pakai akun lama bila password sama
      const r = await tmp.auth.signInWithPassword({ email, password });
      if (r.error || !r.data.user) throw new Error('Username sudah digunakan');
      return r.data.user.id;
    }
    throw error;
  }
  if (!data.user || (data.user.identities && data.user.identities.length === 0)) throw new Error('Username sudah digunakan');
  return data.user.id;
}

/* ---------- nama & relasi ---------- */
const userName = uid => (M.user[uid] || {}).full_name || '—';
const clientName = cid => { const c = M.client[cid]; return c ? userName(c.user_id) : '—'; };
const trainerName = tid => { const t = M.trainer[tid]; return t ? userName(t.user_id) : '—'; };
const clientPhone = cid => { const c = M.client[cid]; return c && M.user[c.user_id] ? M.user[c.user_id].phone : null; };
const pkgOfClient = cid => S.packages.filter(p => p.client_id === cid);
const activePkgs = cid => pkgOfClient(cid).filter(p => p.is_active !== false);

/* ---------- aturan bisnis (PRD v2) ---------- */
const isPostpaid = p => !!p && (p.billing_type === 'postpaid' || /pascabayar|postpaid/i.test(p.package_name || ''));
const isCounted = s => s.status === 'completed' || ((s.status === 'cancelled' || s.status === 'no_show') && !!s.counts_toward_balance);
const STATUS = {
  scheduled: ['Terjadwal', 'info'], check_in: ['Berjalan', 'warn'], completed: ['Selesai', 'ok'],
  cancelled: ['Batal', 'bad'], no_show: ['No-show', 'bad'], rescheduled: ['Dijadwal ulang', ''],
};
const statusBadge = s => { const [l, k] = STATUS[s] || [s, '']; return `<span class="badge ${k}">${esc(l)}</span>`; };
const paidOf = pid => S.trx.filter(t => t.package_id === pid && !t.voided_at && (t.payment_status === 'paid' || t.payment_status === 'partial')).reduce((a, t) => a + (t.kind === 'refund' ? -num(t.amount) : num(t.amount)), 0);
const outstandingOf = p => isPostpaid(p) ? 0 : Math.max(num(p.total_price) - paidOf(p.id), 0);
const remainingOf = p => isPostpaid(p) ? null : Math.max(p.total_sessions - p.used_sessions, 0);
const PAY = { pending: ['Belum bayar', 'bad'], partial: ['Sebagian', 'warn'], paid: ['Lunas', 'ok'], refunded: ['Refund', ''] };
const payBadge = p => { if (isPostpaid(p)) return '<span class="badge info">Pascabayar</span>'; const [l, k] = PAY[p.payment_status] || [p.payment_status, '']; return `<span class="badge ${k}">${esc(l)}</span>`; };

/** Tagihan pascabayar untuk satu bulan: sesi dihitung x tarif, dikurangi pembayaran bulan tsb. */
function monthBilling(pkg, month) {
  const sess = S.sessions.filter(s => s.package_id === pkg.id && ym(s.scheduled_at) === month && isCounted(s));
  const value = sess.length * num(pkg.price_per_session);
  const tag = `Billing Pascabayar: ${month}`;
  const paid = S.trx.filter(t => t.package_id === pkg.id && !t.voided_at && (t.notes || '').includes(tag)).reduce((a, t) => a + num(t.amount), 0);
  return { sessions: sess.length, value, paid, outstanding: Math.max(value - paid, 0) };
}
/** Total sisa tagihan klien: prabayar (sisa paket) + pascabayar bulan terpilih. */
function clientOutstanding(cid, month) {
  return activePkgs(cid).reduce((a, p) => a + (isPostpaid(p) ? monthBilling(p, month).outstanding : outstandingOf(p)), 0);
}
function clientRemainingSessions(cid) { return activePkgs(cid).filter(p => !isPostpaid(p)).reduce((a, p) => a + remainingOf(p), 0); }
const sessionsOfClient = cid => S.sessions.filter(s => s.client_id === cid);
function bankFor(trainerId) { return S.banks.filter(b => b.trainer_id === trainerId && b.is_active !== false); }

function bindSessionActions(root) {

async function pgJadwal(d) {

      <div class="weekbar">${days.map((x, i) => `<button class="${x === day ? 'on' : ''}" data-day="${x}"><small>${names[i]}</small><b>${+x.slice(8)}</b>${byDay(x).length ? '<i></i>' : '<i style="opacity:0"></i>'}</button>`).join('')}</div>

      ${hist.length ? `<div class="sec-h"><h3>Riwayat</h3></div><div class="list">${hist.map(s => sessionRow(s, { date: true, noClient: true })).join('')}</div>` : ''}`,

async function pgLive(id) {

  const started = new Date(s.check_in_at || s.updated_at || Date.now()).getTime();
  const C = 2 * Math.PI * 105;
  return {
    title: 'Sesi berjalan',
    html: `<div class="live"><div class="fx3d" id="kb" style="width:200px;height:150px"></div><div><b style="font-size:18px">${esc(clientName(s.client_id))}</b><div class="muted small">${esc(s.program_type || 'Sesi PT')}${s.location ? ' · ' + esc(s.location) : ''}</div></div>

      <div class="fld" style="width:100%;text-align:left"><label>RPE (1–5)</label><div class="rpe" id="rpe">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-v="${n}">${n}</button>`).join('')}</div></div>
      <div class="fld" style="width:100%;text-align:left"><label>Catatan sesi</label><textarea id="ln" placeholder="Beban, progres, catatan teknik…">${esc(s.session_notes || '')}</textarea></div>
      <button class="btn primary block" id="fin">Selesaikan sesi</button><a class="btn block" href="#/jadwal">Kembali (sesi tetap berjalan)</a></div>`,
    mount(v) {
      FX.attach($('#kb', v), 'kettlebell');
      let rpeV = null; const tm = $('#tm', v), ring = $('#ring', v);
      const tick = () => { if (!tm.isConnected) return; const sec = Math.max(0, Math.floor((Date.now() - started) / 1000)); tm.textContent = `${String(Math.floor(sec / 3600) ? Math.floor(sec / 3600) + ':' : '')}${String(Math.floor(sec % 3600 / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`; ring.style.strokeDashoffset = C * (1 - Math.min(sec / 3600, 1)); setTimeout(tick, 1000); };
      tick();
      $('#rpe', v).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; rpeV = +b.dataset.v; $$('#rpe button', v).forEach(x => x.classList.toggle('on', x === b)); });
      $('#fin', v).onclick = async ev => {
        if (!rpeV) { toast('Pilih RPE dahulu', 'err'); return; }
        const r = await act(ev.currentTarget, () => rpc('app_complete_session', { p_session: id, p_rpe: rpeV, p_notes: $('#ln', v).value.trim() || null }), 'Sesi selesai');
        if (r.ok) { await reload('sessions', 'packages'); go('#/jadwal'); }
      };
    },
  };
}

const PAYSTATE = { tab: null, pkg: '', month: null };
const BUCKET = 'payment-proofs';
const payTabs = () => isAdmin() ? [['recon', 'Tagihan'], ['reports', 'Laporan PT'], ['record', 'Catat bayar'], ['trx', 'Transaksi'], ['banks', 'Rekening']]
  : isPT() ? [['recon', 'Tagihan'], ['report', 'Lapor bayar'], ['myrep', 'Laporan saya'], ['banks', 'Rekening']]
    : [['recon', 'Tagihan'], ['trx', 'Riwayat'], ['banks', 'Cara bayar']];
const REP = { pending: ['Menunggu', 'warn'], confirmed: ['Dikonfirmasi', 'ok'], rejected: ['Ditolak', 'bad'] };
const trxLabel = t => t.voided_at ? '<span class="badge bad">Void</span>' : t.kind === 'refund' ? '<span class="badge">Refund</span>' : '<span class="badge ok">Lunas</span>';
const payablePkgs = () => S.packages.filter(p => p.is_active !== false && M.client[p.client_id] && (isPostpaid(p) || outstandingOf(p) > 0 || true));
const pkgLabel = p => `${clientName(p.client_id)} — ${p.package_name}${isPostpaid(p) ? ' (pascabayar)' : ' · sisa ' + rp(outstandingOf(p))}`;
const pkgOptions = sel => payablePkgs().map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(pkgLabel(p))}</option>`).join('');

async function signedUrl(path) { const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 300); if (error) throw error; return data.signedUrl; }

async function pgPayments() {
  const tabs = payTabs(); if (!PAYSTATE.tab || !tabs.some(t => t[0] === PAYSTATE.tab)) PAYSTATE.tab = 'recon';
  const month = PAYSTATE.month || ym(new Date()); const tab = PAYSTATE.tab;
  let body = '';
  if (tab === 'recon') body = tabRecon(month);
  else if (tab === 'reports') body = tabReports();
  else if (tab === 'record') body = tabRecord(month);
  else if (tab === 'trx') body = tabTrx();
  else if (tab === 'report') body = tabReport(month);
  else if (tab === 'myrep') body = tabMyReports();
  else if (tab === 'banks') body = tabBanks();
  const pend = S.reports.filter(r => r.status === 'pending').length;
  return {
    title: isClient() ? 'Tagihan' : 'Pembayaran',
    html: `<div class="page-h"><div><h2>${isClient() ? 'Tagihan' : 'Pembayaran'}</h2><p>${isAdmin() ? 'Catat, konfirmasi, dan rekonsiliasi' : isPT() ? 'Laporkan pembayaran klien ke Admin' : 'Rincian tagihan dan riwayat bayar'}</p></div></div>
      <div class="seg" id="ptabs" style="margin-bottom:14px">${tabs.map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" data-tab="${k}">${l}${k === 'reports' && pend ? ` <span class="badge bad" style="margin-left:4px">${pend}</span>` : ''}</button>`).join('')}</div>${body}`,
    mount(v) {
      $$('#ptabs button', v).forEach(b => b.onclick = () => { PAYSTATE.tab = b.dataset.tab; rerender(false); });
      $$('[data-mm]', v).forEach(b => b.onclick = () => { PAYSTATE.month = addMonths(month, +b.dataset.mm); rerender(); });
      mountTab(v, tab, month);
    },
  };
}
const monthNav = month => `<div class="row between" style="margin-bottom:10px"><span class="muted small">Pascabayar ditagih per bulan</span><div class="row gap-s"><button class="icon-btn" data-mm="-1" aria-label="Bulan sebelumnya">${ic('back')}</button><b class="small">${esc(monthLabel(month))}</b><button class="icon-btn" data-mm="1" aria-label="Bulan berikutnya">${ic('back').replace('<svg', '<svg style="transform:rotate(180deg)"')}</button></div></div>`;

/* ---- Tagihan ---- */
function tabRecon(month) {
  const cls = (isClient() ? S.clients.filter(c => c.id === S.clientId) : S.clients.filter(c => c.is_active !== false)).map(c => ({ c, out: clientOutstanding(c.id, month) })).sort((a, b) => b.out - a.out);
  const total = cls.reduce((a, x) => a + x.out, 0);
  return `${monthNav(month)}<div class="kpis" style="grid-template-columns:1fr 1fr"><div class="kpi"><div class="k">Total sisa tagihan</div><div class="v num">${rp(total)}</div></div><div class="kpi"><div class="k">Klien menunggak</div><div class="v num">${cls.filter(x => x.out > 0).length}</div></div></div>
  <div class="list" style="margin-top:12px">${cls.length ? cls.map(({ c, out }) => {
    const pk = activePkgs(c.id);
    return `<div class="item" style="flex-direction:column;align-items:stretch"><div class="row between"><div class="grow"><div class="t">${esc(clientName(c.id))}</div><div class="d">${pk.length ? pk.map(p => esc(p.package_name)).join(', ') : 'Belum ada paket'}</div></div><span class="badge ${out > 0 ? 'bad' : 'ok'}">${out > 0 ? rp(out) : 'Lunas'}</span></div>
      ${pk.map(p => { if (isPostpaid(p)) { const b = monthBilling(p, month); return `<div class="d" style="margin-top:6px">${esc(p.package_name)}: ${b.sessions} sesi × ${rp(p.price_per_session)} = ${rp(b.value)} · dibayar ${rp(b.paid)}</div>`; } return `<div class="d" style="margin-top:6px">${esc(p.package_name)}: ${rp(paidOf(p.id))} dari ${rp(p.total_price)}</div>`; }).join('')}</div>`;
  }).join('') : '<div class="empty"><b>Belum ada data</b></div>'}</div>`;
}

/* ---- Admin: laporan PT ---- */
function tabReports() {
  const list = S.reports.slice().sort((a, b) => (a.status === 'pending' ? 0 : 1) - (b.status === 'pending' ? 0 : 1) || b.created_at.localeCompare(a.created_at)).slice(0, 60);
  return `<div class="list">${list.length ? list.map(r => { const [l, k] = REP[r.status] || [r.status, '']; return `<div class="item" style="flex-direction:column;align-items:stretch"><div class="row between"><div class="grow"><div class="t">${esc(clientName(r.client_id))} · ${rp(r.amount)}</div><div class="d">PT ${esc(trainerName(r.trainer_id))} · ${esc(fmtDT(r.created_at))}${r.period_month ? ' · ' + esc(monthLabel(r.period_month)) : ''}</div></div><span class="badge ${k}">${l}</span></div>
    ${r.notes ? `<div class="d">${esc(r.notes)}</div>` : ''}${r.reject_reason ? `<div class="d">Ditolak: ${esc(r.reject_reason)}</div>` : ''}
    <div class="btn-row" style="margin-top:8px"><button class="btn sm" data-proof="${esc(r.proof_path)}">${ic('img', 'sm')} Lihat bukti</button>${r.status === 'pending' ? `<button class="btn sm primary" data-confirm="${r.id}">Konfirmasi</button><button class="btn sm danger" data-reject="${r.id}">Tolak</button>` : ''}${r.transaction_id ? `<a class="btn sm" href="#/receipt/${r.transaction_id}">Kuitansi</a>` : ''}</div></div>`; }).join('') : '<div class="empty"><b>Belum ada laporan</b>Laporan pembayaran dari PT muncul di sini.</div>'}</div>`;
}
/* ---- Admin: catat bayar ---- */
function tabRecord(month) {
  return `<form id="rf" class="form card"><div class="fld"><label>Paket klien</label><select name="pkg" required><option value="">Pilih…</option>${pkgOptions(PAYSTATE.pkg)}</select></div>
    <div class="fld" id="mwrap" hidden><label>Untuk bulan (pascabayar)</label><input type="month" name="month" value="${month}"></div>
    <div class="fld"><label>Jumlah (Rp)</label><input name="amount" type="number" min="1" inputmode="numeric" required></div>
    <div class="fld"><label>Catatan</label><input name="notes" placeholder="Transfer BCA / tunai"></div><button class="btn primary block">Catat pembayaran</button></form>`;
}
/* ---- Admin/Klien: transaksi ---- */
function tabTrx() {
  const list = S.trx.filter(t => isClient() ? t.client_id === S.clientId : true).sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, 80);
  return `<div class="list">${list.length ? list.map(t => `<div class="item" style="flex-wrap:wrap${t.voided_at ? ';opacity:.6' : ''}"><div class="grow"><div class="t">${rp(t.amount)} · ${esc(clientName(t.client_id))}</div><div class="d">${esc(t.receipt_number || '–')} · ${esc(fmtDate(t.payment_date || t.created_at))}${t.notes ? ' · ' + esc(t.notes) : ''}</div>${t.voided_at ? `<div class="d">Void: ${esc(t.void_reason || '')}</div>` : ''}</div>
    <div class="r">${trxLabel(t)}</div><div class="row gap-s" style="width:100%;justify-content:flex-end"><a class="btn sm" href="#/receipt/${t.id}">${ic('print', 'sm')} Kuitansi</a>${isAdmin() && !t.voided_at ? `<button class="btn sm danger" data-void="${t.id}">Void</button>` : ''}</div></div>`).join('') : '<div class="empty"><b>Belum ada transaksi</b></div>'}</div>`;
}
/* ---- PT: lapor bayar ---- */
function tabReport(month) {
  const mine = S.packages.filter(p => p.is_active !== false && M.client[p.client_id]);
  return `<div class="note" style="margin-bottom:12px">Laporkan uang yang Anda terima dari klien. Admin akan memeriksa bukti lalu mengonfirmasi dan menerbitkan kuitansi.</div>
  <form id="rf" class="form card"><div class="fld"><label>Paket klien</label><select name="pkg" required><option value="">Pilih…</option>${mine.map(p => `<option value="${p.id}">${esc(pkgLabel(p))}</option>`).join('')}</select></div>
    <div class="fld" id="mwrap" hidden><label>Untuk bulan (pascabayar)</label><input type="month" name="month" value="${month}"></div>
    <div class="fld"><label>Jumlah (Rp)</label><input name="amount" type="number" min="1" inputmode="numeric" required></div>
    <div class="fld"><label>Bukti transfer (foto)</label><input name="proof" type="file" accept="image/*" required></div>
    <div class="fld"><label>Catatan</label><input name="notes"></div><button class="btn primary block">Kirim laporan</button></form>`;
}
function tabMyReports() {
  const list = S.reports.slice().sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, 40);
  return `<div class="list">${list.length ? list.map(r => { const [l, k] = REP[r.status] || [r.status, '']; return `<div class="item"><div class="grow"><div class="t">${esc(clientName(r.client_id))} · ${rp(r.amount)}</div><div class="d">${esc(fmtDT(r.created_at))}${r.reject_reason ? ' · Ditolak: ' + esc(r.reject_reason) : ''}</div></div><span class="badge ${k}">${l}</span></div>`; }).join('') : '<div class="empty"><b>Belum ada laporan</b></div>'}</div>`;
}
/* ---- Rekening ---- */
function tabBanks() {
  let list = S.banks; if (isClient()) { const c = M.client[S.clientId]; list = c ? bankFor(c.trainer_id) : []; } else if (isPT()) list = S.banks.filter(b => b.trainer_id === S.trainerId);
  return `<div class="list">${list.length ? list.map(b => `<div class="item"><div class="avatar">${ic('bank')}</div><div class="grow"><div class="t">${esc(b.bank_name)} · ${esc(b.account_number)}</div><div class="d">a.n. ${esc(b.account_holder)}${isAdmin() ? ' · PT ' + esc(trainerName(b.trainer_id)) : ''}${b.is_active === false ? ' · nonaktif' : ''}</div></div>
    <div class="r row gap-s"><button class="icon-btn" data-copy="${esc(b.account_number)}" aria-label="Salin nomor">${ic('check')}</button>${isAdmin() ? `<button class="icon-btn" data-bedit="${b.id}" aria-label="Ubah">${ic('edit')}</button><button class="icon-btn" data-bdel="${b.id}" aria-label="Hapus">${ic('trash')}</button>` : ''}</div></div>`).join('') : '<div class="empty"><b>Belum ada rekening</b>' + (isAdmin() ? 'Tambahkan rekening untuk tiap PT.' : 'Hubungi Admin.') + '</div>'}</div>${isAdmin() ? `<button class="btn primary block" style="margin-top:12px" data-badd>${ic('plus', 'sm')} Tambah rekening</button>` : ''}`;
}
function bankSheet(b) {
  openSheet({
    title: b ? 'Ubah rekening' : 'Rekening baru',
    body: `<form id="bf" class="form"><div class="fld"><label>Personal Trainer</label><select name="tr" required>${trainerOptions(b ? b.trainer_id : '')}</select></div><div class="fld"><label>Bank</label><input name="bank" required value="${esc(b ? b.bank_name : '')}" placeholder="BCA"></div><div class="fld"><label>Nomor rekening</label><input name="no" required inputmode="numeric" value="${esc(b ? b.account_number : '')}"></div><div class="fld"><label>Atas nama</label><input name="holder" required value="${esc(b ? b.account_holder : '')}"></div><label class="check"><input type="checkbox" name="active" ${!b || b.is_active !== false ? 'checked' : ''}> Aktif</label></form>`,
    footer: '<button class="btn" data-close>Batal</button><button class="btn primary" data-save>Simpan</button>',
    onMount(el, close) {
      $('[data-save]', el).onclick = async ev => {
        const f = $('#bf', el); if (!f.reportValidity()) return;
        const row = { trainer_id: f.elements.tr.value, bank_name: f.elements.bank.value.trim(), account_number: f.elements.no.value.trim(), account_holder: f.elements.holder.value.trim(), is_active: f.elements.active.checked };
        const r = await act(ev.currentTarget, async () => { const q = b ? sb.from('pt_bank_accounts').update(row).eq('id', b.id) : sb.from('pt_bank_accounts').insert(row); const { error } = await q; if (error) throw error; await reload('banks'); }, 'Rekening disimpan');
        if (r.ok) { close(); rerender(); }
      };
    },
  });
}

function mountTab(v, tab, month) {
  if (tab === 'reports') {
    v.addEventListener('click', async e => {
      const p = e.target.closest('[data-proof]'), c = e.target.closest('[data-confirm]'), x = e.target.closest('[data-reject]');
      if (p) { const r = await act(p, async () => { const u = await signedUrl(p.dataset.proof); openSheet({ title: 'Bukti transfer', body: `<img src="${esc(u)}" alt="Bukti transfer" style="width:100%;border-radius:12px">`, wide: true }); }); }
      else if (c) { if (!await confirmDlg({ title: 'Konfirmasi pembayaran?', message: 'Pembayaran dicatat dan kuitansi diterbitkan.', okText: 'Konfirmasi' })) return; const r = await act(c, () => rpc('app_confirm_payment_report', { p_id: c.dataset.confirm }), 'Pembayaran dikonfirmasi'); if (r.ok) { await reload('reports', 'trx', 'packages'); rerender(); } }
      else if (x) {
        openSheet({ title: 'Tolak laporan', body: '<div class="fld"><label>Alasan (wajib)</label><textarea id="rr"></textarea></div>', footer: '<button class="btn" data-close>Batal</button><button class="btn danger" data-save>Tolak</button>',
          onMount(el, close) { $('[data-save]', el).onclick = async ev => { const reason = $('#rr', el).value.trim(); if (!reason) { toast('Alasan wajib diisi', 'err'); return; } const r = await act(ev.currentTarget, () => rpc('app_reject_payment_report', { p_id: x.dataset.reject, p_reason: reason }), 'Laporan ditolak'); if (r.ok) { close(); await reload('reports'); rerender(); } }; } });
      }
    });
  }
  if (tab === 'trx') v.addEventListener('click', e => {
    const b = e.target.closest('[data-void]'); if (!b) return;
    openSheet({ title: 'Void transaksi', body: '<p class="muted small" style="margin-bottom:10px">Transaksi tidak dihapus, hanya ditandai void dan saldo paket dihitung ulang.</p><div class="fld"><label>Alasan (wajib)</label><textarea id="vr"></textarea></div>', footer: '<button class="btn" data-close>Batal</button><button class="btn danger" data-save>Void</button>',
      onMount(el, close) { $('[data-save]', el).onclick = async ev => { const reason = $('#vr', el).value.trim(); if (!reason) { toast('Alasan wajib diisi', 'err'); return; } const r = await act(ev.currentTarget, () => rpc('app_void_transaction', { p_id: b.dataset.void, p_reason: reason }), 'Transaksi di-void'); if (r.ok) { close(); await reload('trx', 'packages'); rerender(); } }; } });
  });
  if (tab === 'banks') {
    v.addEventListener('click', async e => {
      const cp = e.target.closest('[data-copy]'), ed = e.target.closest('[data-bedit]'), dl = e.target.closest('[data-bdel]'), ad = e.target.closest('[data-badd]');
      if (cp) { try { await navigator.clipboard.writeText(cp.dataset.copy); toast('Nomor disalin'); } catch { toast(cp.dataset.copy); } }
      else if (ad) bankSheet(null); else if (ed) bankSheet(S.banks.find(b => b.id === ed.dataset.bedit));
      else if (dl) { if (!await confirmDlg({ title: 'Hapus rekening?', message: 'Rekening dihapus permanen.', okText: 'Hapus', danger: true })) return; const r = await act(dl, async () => { const { error } = await sb.from('pt_bank_accounts').delete().eq('id', dl.dataset.bdel); if (error) throw error; await reload('banks'); }, 'Rekening dihapus'); if (r.ok) rerender(); }
    });
  }
  const f = $('#rf', v); if (!f) return;
  const sel = f.elements.pkg, mw = $('#mwrap', f), amt = f.elements.amount;
  const sync = () => { const p = M.pkg[sel.value]; mw.hidden = !(p && isPostpaid(p)); if (p && !amt.value) { const out = isPostpaid(p) ? monthBilling(p, f.elements.month.value || month).outstanding : outstandingOf(p); if (out > 0) amt.value = out; } };
  sel.addEventListener('change', () => { amt.value = ''; sync(); }); f.elements.month.addEventListener('change', () => { amt.value = ''; sync(); });
  if (PAYSTATE.pkg) { sel.value = PAYSTATE.pkg; PAYSTATE.pkg = ''; sync(); }
  f.addEventListener('submit', async e => {
    e.preventDefault(); const btn = $('button', f), p = M.pkg[sel.value]; const pm = p && isPostpaid(p) ? f.elements.month.value : null;
    if (isAdmin()) {
      const r = await act(btn, () => rpc('app_record_payment', { p_package: sel.value, p_amount: +amt.value, p_notes: f.elements.notes.value.trim() || null, p_month: pm }), 'Pembayaran dicatat');
      if (r.ok) { await reload('trx', 'packages'); toast('Kuitansi ' + (r.data && r.data.receipt_number || '') + ' diterbitkan'); PAYSTATE.tab = 'trx'; rerender(false); }
    } else {
      const file = f.elements.proof.files[0]; if (!file) { toast('Unggah foto bukti', 'err'); return; }
      if (file.size > 8 * 1024 * 1024) { toast('Foto maksimal 8 MB', 'err'); return; }
      const r = await act(btn, async () => {
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'jpg';
        const path = `${S.me.id}/${uuid()}.${ext}`;
        const up = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || 'image/jpeg', upsert: false }); if (up.error) throw up.error;
        await rpc('app_submit_payment_report', { p_package: sel.value, p_amount: +amt.value, p_proof_path: path, p_notes: f.elements.notes.value.trim() || null, p_period_month: pm });
        await reload('reports');
      }, 'Laporan terkirim ke Admin');
      if (r.ok) { PAYSTATE.tab = 'myrep'; rerender(false); }
    }
  });
}

/* ---------------- Kuitansi ---------------- */
async function pgReceipt(id) {
  const t = M.trxById[id];
  if (!t) return { title: 'Kuitansi', html: '<div class="empty"><b>Kuitansi tidak ditemukan</b><a class="btn" href="#/payments">Kembali</a></div>' };
  const p = M.pkg[t.package_id] || {};
  return {
    title: 'Kuitansi',
    html: `<div class="noprint row between" style="margin-bottom:12px"><a href="#/payments" class="small muted row gap-s" data-back>${ic('back', 'sm')} Kembali</a><button class="btn sm primary" data-print>${ic('print', 'sm')} Cetak / PDF</button></div>
    <div class="receipt"><div class="row between"><img src="${LOGO}" alt="" style="width:44px;height:44px;border-radius:10px"><div style="text-align:right"><b>KUITANSI</b><div style="font-size:12px">${esc(t.receipt_number || '–')}</div></div></div>
      ${t.voided_at ? `<div style="margin:12px 0;padding:8px 12px;border:2px solid #c0392b;color:#c0392b;font-weight:800;border-radius:8px;text-align:center">VOID — ${esc(t.void_reason || '')}</div>` : ''}
      <hr><dl class="kv"><dt>Tanggal</dt><dd>${esc(fmtDate(t.payment_date || t.created_at))}</dd><dt>Diterima dari</dt><dd>${esc(clientName(t.client_id))}</dd><dt>Untuk</dt><dd>${esc(p.package_name || '–')}</dd><dt>Personal Trainer</dt><dd>${esc(trainerName(t.trainer_id))}</dd>${t.notes ? `<dt>Catatan</dt><dd>${esc(t.notes)}</dd>` : ''}</dl>
      <hr><div class="row between"><span>Jumlah</span><b style="font-size:24px;font-family:var(--font-h)">${rp(t.amount)}</b></div><p style="font-size:11.5px;margin-top:18px;color:#6b5f59">Elprian Training · terima kasih atas kepercayaan Anda.</p></div>`,
    mount(v) { $('[data-print]', v).onclick = () => window.print(); },
  };
}

/* ---------------- Pengaturan ---------------- */
async function pgSettings() {
  const u = S.me, th = getThemePref(), q = FX.mode();
  const seg = (id, items, cur) => `<div class="seg" id="${id}">${items.map(([k, l]) => `<button type="button" class="${k === cur ? 'on' : ''}" data-v="${k}">${l}</button>`).join('')}</div>`;
  return {
    title: 'Pengaturan',
    html: `<div class="page-h"><div><h2>Pengaturan</h2><p>${esc(u.full_name)} · ${esc(roleLabel(S.role))}</p></div></div>
    <form id="pf" class="form card"><h3>Profil</h3><div class="fld"><label>Nama lengkap</label><input name="full_name" required value="${esc(u.full_name)}"></div><div class="fld"><label>Telepon</label><input name="phone" value="${esc(u.phone || '')}"></div><button class="btn primary">Simpan profil</button></form>
    <div class="card form" style="margin-top:12px"><h3>Tampilan</h3><div class="fld"><label>Tema</label>${seg('th', [['auto', 'Ikuti HP'], ['light', 'Terang'], ['dark', 'Gelap']], th)}</div>
      <div class="fld"><label>Warna</label>${seg('pal', [['green', 'Hijau Neon Lab'], ['red', 'Merah Strength']], getPalPref())}</div>
      <div class="fld"><label>Kualitas 3D <span class="muted small">(aktif: ${FX.label()})</span></label>${seg('q3', [['auto', 'Otomatis'], ['high', 'Tinggi'], ['medium', 'Sedang'], ['low', 'Hemat']], q)}<span class="hint">Hemat = tanpa animasi 3D, paling ringan untuk baterai.</span></div></div>
    <form id="pw" class="form card" style="margin-top:12px" autocomplete="off"><h3>Ganti password</h3><div class="fld"><label>Password baru</label><input name="p1" type="password" minlength="6" required autocomplete="new-password"></div><div class="fld"><label>Ulangi password</label><input name="p2" type="password" minlength="6" required autocomplete="new-password"></div><button class="btn">Ganti password</button></form>
    <button class="btn danger block" style="margin-top:12px" data-logout>${ic('logout', 'sm')} Keluar</button><p class="faint small" style="text-align:center;margin-top:14px">Elprian Training ${VERSION}</p>`,
    mount(v) {
      $('#pf', v).addEventListener('submit', async e => { e.preventDefault(); const f = e.target; const r = await act($('button', f), async () => { await rpc('app_update_my_profile', { p_full_name: f.elements.full_name.value.trim(), p_phone: f.elements.phone.value.trim() || null }); await reload('users'); S.me = M.user[S.me.id] || S.me; }, 'Profil disimpan'); if (r.ok) rerender(); });
      $('#th', v).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; setThemePref(b.dataset.v); $$('#th button', v).forEach(x => x.classList.toggle('on', x === b)); const t = $('[data-theme-toggle]'); if (t) t.innerHTML = ic(document.documentElement.dataset.theme === 'dark' ? 'sun' : 'moon'); });
      $('#pal', v).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; setPalPref(b.dataset.v); $$('#pal button', v).forEach(x => x.classList.toggle('on', x === b)); FX.refresh(); });
      $('#q3', v).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; FX.setMode(b.dataset.v); if (window.__setFx) window.__setFx(); toast('Kualitas 3D: ' + (b.dataset.v === 'auto' ? 'Otomatis (' + FX.label() + ')' : b.textContent)); rerender(); });
      $('#pw', v).addEventListener('submit', async e => { e.preventDefault(); const f = e.target; if (f.elements.p1.value !== f.elements.p2.value) { toast('Password tidak sama', 'err'); return; } const r = await act($('button', f), async () => { const { error } = await sb.auth.updateUser({ password: f.elements.p1.value }); if (error) throw error; }, 'Password diganti'); if (r.ok) f.reset(); });
    },
  };
}

'use strict';
/* ======================= Tampilan 3D ringan: bentuk melayang, tilt kartu, animasi masuk ======================= */
(function () {
  try {
    const s = document.createElement('div'); s.className = 'nb-shapes'; s.setAttribute('aria-hidden', 'true'); s.innerHTML = '<i></i><i></i><i></i><i></i>'; document.body.prepend(s);
    const setFx = () => { document.body.dataset.fx = (typeof FX !== 'undefined' && FX.label() === 'Hemat') ? 'lite' : 'full'; };
    setFx(); window.__setFx = setFx;
    const SEL = '.hero,.kpi,.card,.item';
    const fine = matchMedia('(hover:hover) and (pointer:fine)').matches, reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
    const lite = () => document.body.dataset.fx === 'lite';
    let cur = null;
    const reset = t => { if (!t) return; t.style.transform = ''; t.classList.remove('tilting'); };
    document.addEventListener('pointermove', e => {
      if (!fine || reduce || lite() || e.pointerType === 'touch') return;
      const t = e.target.closest && e.target.closest(SEL);
      if (cur && cur !== t) reset(cur);
      cur = t; if (!t || t.closest('.overlay,.auth')) return;
      const r = t.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      const m = t.classList.contains('hero') ? 9 : (r.width > 500 ? 2.5 : 7);
      t.style.setProperty('--mx', (x * 100).toFixed(0) + '%'); t.style.setProperty('--my', (y * 100).toFixed(0) + '%');
      t.style.transform = `perspective(900px) rotateX(${((.5 - y) * m).toFixed(2)}deg) rotateY(${((x - .5) * m).toFixed(2)}deg) translateZ(6px)`;
      t.classList.add('tilting');
    }, { passive: true });
    document.addEventListener('pointerout', e => { if (cur && !cur.contains(e.relatedTarget)) { reset(cur); cur = null; } }, { passive: true });
    document.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'touch' || lite()) return;
      const t = e.target.closest && e.target.closest(SEL); if (!t) return;
      const r = t.getBoundingClientRect(); t.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(0) + '%'); t.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(0) + '%');
      t.classList.add('tilting'); setTimeout(() => t.classList.remove('tilting'), 450);
    }, { passive: true });
    /* animasi masuk tiap halaman berganti */
    const app = document.getElementById('app'); let lastKey = '';
    if (app) new MutationObserver(() => {
      const v = document.getElementById('view'); if (!v) return;
      const k = location.hash.split('?')[0]; if (k === lastKey) return; lastKey = k;
      v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); setTimeout(() => v.classList.remove('enter'), 900);
    }).observe(app, { childList: true });
    window.addEventListener('hashchange', () => { lastKey = ''; });
  } catch (_) { }
})();

</script>

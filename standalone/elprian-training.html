*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background-color:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(900px 560px at 88% -8%,var(--b2),transparent 60%),radial-gradient(800px 560px at -8% 28%,var(--b1),transparent 58%),radial-gradient(900px 700px at 50% 112%,var(--b3),transparent 65%)}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4,.btn,.chip,.badge,.kpi .v,.bnav a,.seg button{font-family:var(--font-h)}
h1,h2,h3{letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand);text-decoration:none}
[hidden]{display:none!important}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}.small{font-size:12.5px}.num{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}

/* bentuk melayang (latar) */
.nb-shapes{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.nb-shapes i{position:absolute;display:block;border-radius:50%;opacity:.3;animation:nbf 18s ease-in-out infinite;background:radial-gradient(circle at 32% 28%,#fff 0,rgba(255,255,255,0) 34%),radial-gradient(circle at 50% 50%,var(--c,var(--neon)),transparent 70%)}
.nb-shapes i:nth-child(1){width:180px;height:180px;left:-50px;top:18%}
.nb-shapes i:nth-child(2){--c:var(--accent);width:120px;height:120px;right:-30px;top:44%;animation-delay:-6s;animation-duration:22s}
.nb-shapes i:nth-child(3){--c:#a3e635;width:90px;height:90px;left:62%;top:8%;animation-delay:-11s;animation-duration:16s}
.nb-shapes i:nth-child(4){--c:#8b5cf6;width:140px;height:140px;left:6%;bottom:-40px;animation-delay:-3s;animation-duration:26s;opacity:.2}
:root[data-pal="red"] .nb-shapes i:nth-child(3){--c:#f59e0b}
:root[data-pal="red"] .nb-shapes i:nth-child(4){--c:#fb7185}
@keyframes nbf{0%,100%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(22px,-34px,0) scale(1.08)}66%{transform:translate3d(-16px,20px,0) scale(.94)}}

/* shell */
#app{min-height:100vh}
.shell{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:calc(var(--top-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--line);box-shadow:0 8px 24px -16px rgba(4,60,40,.3)}
.top .logo{width:34px;height:34px;border-radius:11px}
.top h1{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view{width:100%;max-width:940px;margin:0 auto;padding:14px 16px calc(var(--nav-h) + 44px + env(safe-area-inset-bottom))}
.view.enter>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.view.enter>*:nth-child(2){animation-delay:.05s}.view.enter>*:nth-child(3){animation-delay:.1s}.view.enter>*:nth-child(4){animation-delay:.15s}.view.enter>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:perspective(900px) translateY(18px) rotateX(-8deg)}to{opacity:1;transform:none}}
/* dock melayang */
.bnav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:7px;border-radius:26px;background:var(--dock-bg);border:1px solid color-mix(in srgb,var(--brand) 22%,var(--line));backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 1px 0 var(--gl-hi) inset,0 -1px 0 var(--gl-lo) inset,0 22px 44px -10px rgba(4,60,40,.38),0 0 30px -12px var(--glow)}
.bnav a{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:19px;color:var(--ink-2);font-size:10.5px;font-weight:600;transition:transform .25s cubic-bezier(.2,.9,.3,1.3),background .2s,color .2s,box-shadow .25s}
.bnav a .ic{transition:transform .25s cubic-bezier(.2,.9,.3,1.5),filter .25s}
.bnav a.on{transform:translateY(-6px);padding-bottom:9px;background:var(--grad);color:var(--on-grad);text-shadow:var(--on-grad-sh);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 -3px 0 rgba(0,60,40,.25) inset,0 14px 22px -8px var(--glow),0 0 0 4px color-mix(in srgb,var(--bg) 70%,transparent)}
.bnav a.on .ic{transform:scale(1.15);filter:drop-shadow(0 3px 3px rgba(0,40,28,.35))}
.bnav a:active{transform:scale(.94)}
@media(min-width:900px){
  .side{display:flex;flex-direction:column;gap:6px;width:250px;flex:none;position:sticky;top:0;height:100vh;padding:20px 14px;background:var(--dock-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-right:1px solid var(--line);box-shadow:20px 0 50px -30px rgba(4,60,40,.3)}
  .side .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-family:var(--font-h);font-weight:700;font-size:16px}
  .side .brand img{width:40px;height:40px;border-radius:12px}
  .side a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;color:var(--ink-2);font-weight:700;border:1px solid transparent;transition:transform .2s,background .2s,box-shadow .2s}
  .side a:hover{background:var(--elev);transform:translateX(3px)}
  .side a.on{background:var(--grad);color:var(--on-grad);text-shadow:var(--on-grad-sh);box-shadow:var(--sh-btn);transform:translateX(5px)}
  .side .grow{flex:1}
  .bnav{display:none}
  .view{padding:22px 28px 80px}
  .top .logo{display:none}
}

/* kartu kaca */
.card,.kpi,.item,.seg,.search input,.fld input,.fld select,.fld textarea,.inp{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card,.kpi,.item{position:relative;background:var(--card-bg);border:1px solid color-mix(in srgb,var(--brand) 16%,var(--line));box-shadow:var(--sh-card);transform-style:preserve-3d;will-change:transform;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.card::after,.kpi::after,.item::after,.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(220px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.5),transparent 60%)}
:root[data-theme="dark"] .card::after,:root[data-theme="dark"] .kpi::after,:root[data-theme="dark"] .item::after{background:radial-gradient(220px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--neon) 22%,transparent),transparent 60%)}
.tilting::after{opacity:1}
.card{border-radius:var(--r-lg);padding:16px}
.card+.card,.stack>*+*{margin-top:12px}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.gap-s{gap:6px}.gap-l{gap:16px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 2px 14px}
.page-h h2{font-size:21px;font-weight:700}.page-h p{color:var(--ink-2);font-size:12.5px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec-h h3{font-size:15px;font-weight:700}
.empty{padding:30px 16px;text-align:center;color:var(--ink-2);border:1.5px dashed var(--line-2);border-radius:var(--r-lg);background:var(--surface)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:18px 20px;color:#fff;background:var(--hero);min-height:150px;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 -2px 0 rgba(0,40,28,.25) inset,0 24px 50px -16px var(--glow),0 8px 18px rgba(4,60,40,.25);transform-style:preserve-3d;transition:transform .2s ease-out}
.hero:before{content:"";position:absolute;right:-50px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.hero::after{opacity:1;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 38%),radial-gradient(260px circle at var(--mx,70%) var(--my,0%),rgba(255,255,255,.26),transparent 62%)}
.hero .fx3d{position:absolute;right:-10px;top:-6px;width:170px;height:100%;min-height:150px;pointer-events:none}
.hero .lbl{font-size:11.5px;font-weight:600;opacity:.88;letter-spacing:.3px}
.hero h2{font-size:25px;font-weight:700;margin:4px 0 6px;max-width:68%;text-shadow:0 2px 10px rgba(0,40,28,.3)}
.hero p{opacity:.92;font-size:13px;max-width:68%}
.fx3d{position:relative}.fx3d canvas{display:block;width:100%!important;height:100%!important}
.fx-poster{position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--neon) 55%,#fff) 0,color-mix(in srgb,var(--neon) 28%,transparent) 34%,transparent 64%);filter:blur(2px)}

/* kpi + orb warna */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{border-radius:16px;padding:13px 14px;min-width:0;display:block;color:inherit;overflow:hidden}
.kpi::before{content:"";position:absolute;right:12px;top:12px;width:16px;height:16px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95) 0,rgba(255,255,255,0) 28%),radial-gradient(circle at 35% 30%,var(--ka,#5eead4),var(--kb,#14b8a6) 55%,var(--kd,#0f766e));box-shadow:0 -3px 5px -2px rgba(0,0,0,.35) inset,0 8px 12px -5px var(--kb,#14b8a6)}
.kpis .kpi:nth-child(4n+1){--ka:#99f6e4;--kb:#14b8a6;--kd:#0f766e}
.kpis .kpi:nth-child(4n+2){--ka:#bfdbfe;--kb:#3b82f6;--kd:#1d4ed8}
.kpis .kpi:nth-child(4n+3){--ka:#fde68a;--kb:#f59e0b;--kd:#b45309}
.kpis .kpi:nth-child(4n){--ka:#ddd6fe;--kb:#8b5cf6;--kd:#5b21b6}
.kpi .k{font-size:11.5px;font-weight:600;color:var(--ink-2);padding-right:24px}
.kpi .v{font-size:17px;font-weight:700;margin:3px 0 1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .s{font-size:11.5px;color:var(--ink-3)}
a.kpi:active,button.kpi:active{transform:translateY(1px) scale(.985)}

/* daftar */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;border-radius:16px;padding:12px 14px;width:100%;text-align:left;color:inherit}
a.item:hover,button.item:hover{border-color:color-mix(in srgb,var(--brand) 50%,var(--line))}
a.item:active,button.item:active{transform:translateY(1px) scale(.985)}
.item .t{font-weight:700;font-size:14px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .d{font-size:12px;color:var(--ink-2);margin-top:2px}
.item .r{text-align:right;flex:none}
/* avatar: atom 3D */
.avatar{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:13.5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);
  background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.95) 0,rgba(255,255,255,0) 22%),radial-gradient(circle at 34% 30%,var(--a,#6ee7b7) 0,var(--b,#10b981) 52%,var(--d,#047857) 100%);
  box-shadow:0 -5px 9px -3px rgba(0,0,0,.4) inset,0 3px 5px rgba(255,255,255,.35) inset,0 10px 16px -6px var(--b,#10b981),0 3px 5px rgba(0,30,20,.25);margin:3px 5px 3px 2px}
.avatar::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--b,#10b981) 45%,transparent);pointer-events:none}
.avatar::after{content:"";position:absolute;top:-10.5px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff,var(--o,#22d3ee) 55%,rgba(0,0,0,.4));box-shadow:0 2px 5px var(--o,#22d3ee);transform-origin:50% calc(21px + 10.5px)}
.item:hover .avatar::before,a.item:focus-visible .avatar::before{animation:orbit 6s linear infinite}
.item:hover .avatar::after{animation:orbit 6s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.avatar.c1{--a:#6ee7b7;--b:#10b981;--d:#047857;--o:#22d3ee}
.avatar.c2{--a:#a5f3fc;--b:#22d3ee;--d:#0e7490;--o:#a78bfa}
.avatar.c3{--a:#ddd6fe;--b:#8b5cf6;--d:#5b21b6;--o:#34d399}
.avatar.c4{--a:#fde68a;--b:#f59e0b;--d:#b45309;--o:#22d3ee}
.avatar.c5{--a:#fecdd3;--b:#f43f5e;--d:#be123c;--o:#fbbf24}
.avatar.c6{--a:#bfdbfe;--b:#3b82f6;--d:#1d4ed8;--o:#34d399}
.avatar.mute{--a:#d1d5db;--b:#9ca3af;--d:#6b7280;--o:#9ca3af;filter:saturate(.7)}
.avatar.mute::before{opacity:.5}
.dot{width:8px;height:36px;border-radius:5px;flex:none;background:var(--ink-3);box-shadow:0 0 12px currentColor,0 1px 0 rgba(255,255,255,.5) inset}
.dot.completed{background:linear-gradient(180deg,#6ee7b7,#059669);color:#10b981}
.dot.scheduled{background:linear-gradient(180deg,#93c5fd,#2563eb);color:#3b82f6}
.dot.check_in{background:linear-gradient(180deg,#fde68a,#d97706);color:#f59e0b}
.dot.cancelled,.dot.no_show{background:linear-gradient(180deg,#fda4af,#e11d48);color:#f43f5e}
.dot.rescheduled{background:linear-gradient(180deg,#d1d5db,#6b7280);color:#9ca3af}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;background:var(--elev);color:var(--ink-2);border:1px solid var(--line)}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}.badge.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.progress{height:8px;border-radius:99px;background:var(--subtle);overflow:hidden;box-shadow:var(--press);margin-top:8px}
.progress>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--neon),var(--accent));box-shadow:0 0 10px var(--glow);position:relative}
.progress>i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);animation:sheen 2.6s ease-in-out infinite}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.progress.warn>i{background:linear-gradient(90deg,#fbbf24,#d97706);box-shadow:0 0 10px #fbbf24}.progress.ok>i{background:linear-gradient(90deg,#6ee7b7,#059669)}

/* kontrol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:14px;border:1px solid var(--line-2);background:var(--card-bg);font-weight:700;font-size:13.5px;color:var(--ink);box-shadow:0 1px 0 var(--gl-hi) inset,0 -2px 0 var(--gl-lo) inset,0 6px 14px -8px rgba(5,80,56,.35);transition:transform .12s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gl-hi) inset,0 1px 0 var(--gl-lo) inset}
.btn.primary{background:var(--grad);border-color:rgba(0,60,40,.35);color:var(--on-grad);text-shadow:var(--on-grad-sh);box-shadow:var(--sh-btn)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 0 14px var(--glow)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:34px;padding:0 13px;font-size:12.5px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}.btn-row>.btn{flex:1}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--card-bg);color:var(--ink);box-shadow:0 1px 0 var(--gl-hi) inset,0 6px 12px -8px rgba(5,80,56,.35)}
.icon-btn:hover{border-color:var(--brand)}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));z-index:25;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 18px;border:0;border-radius:99px;background:var(--grad);color:var(--on-grad);text-shadow:var(--on-grad-sh);font-family:var(--font-h);font-weight:700;font-size:13.5px;box-shadow:var(--sh-btn),0 0 0 6px color-mix(in srgb,var(--neon) 14%,transparent)}
@media(min-width:900px){.fab{bottom:28px;right:32px}}
.form{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label{font-size:12px;font-weight:700;color:var(--ink-2)}
.fld input,.fld select,.fld textarea,.inp{width:100%;min-height:46px;padding:10px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 80%,transparent);box-shadow:var(--press);outline:none;color:var(--ink);font-size:14px}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{border-color:var(--brand);box-shadow:0 2px 5px rgba(5,80,56,.08) inset,0 0 0 3px color-mix(in srgb,var(--brand) 28%,transparent),0 0 22px -4px var(--glow)}
.fld .hint{font-size:12px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:10px;align-items:center;font-weight:700}.check input{width:20px;height:20px;min-height:0;accent-color:var(--brand)}
.seg{display:flex;gap:4px;padding:4px;background:var(--elev);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;box-shadow:var(--press)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;padding:9px 14px;border-radius:12px;font-weight:600;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--grad);color:var(--on-grad);text-shadow:var(--on-grad-sh);box-shadow:var(--sh-btn)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chip{flex:none;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card-bg);font-weight:600;font-size:12.5px;color:var(--ink-2);box-shadow:0 1px 0 var(--gl-hi) inset,0 4px 10px -6px rgba(5,80,56,.3);transition:transform .15s}
.chip.on{background:var(--grad);color:var(--on-grad);text-shadow:var(--on-grad-sh);border-color:transparent;box-shadow:var(--sh-btn);transform:translateY(-1px)}
.search{position:relative;margin-bottom:12px}.search .ic{position:absolute;left:14px;top:13px;color:var(--ink-3);z-index:1}.search input{padding-left:42px}
.note{padding:11px 13px;border-radius:var(--r-md);background:var(--info-bg);font-size:13px}
.note.warn{background:var(--warn-bg)}.note.bad{background:var(--bad-bg)}.note.ok{background:var(--ok-bg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}.kv dt{color:var(--ink-2)}.kv dd{margin:0;text-align:right;font-weight:700}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
.weekbar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.weekbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:14px;border:1px solid var(--line);background:var(--card-bg);font-family:var(--font-h);font-weight:700;font-size:15px;color:var(--ink);box-shadow:var(--sh-card)}
.weekbar button small{font-size:10px;color:var(--ink-3);font-weight:600}
.weekbar button.on{background:var(--grad);color:var(--on-grad);text-shadow:var(--on-grad-sh);border-color:transparent;box-shadow:var(--sh-btn);transform:translateY(-2px)}.weekbar button.on small{color:inherit;opacity:.8}
.weekbar button i{width:5px;height:5px;border-radius:50%;background:var(--brand);opacity:0}.weekbar button.has i{opacity:1}.weekbar button.on i{background:currentColor}

/* sheet & modal kaca */
.overlay{position:fixed;inset:0;z-index:100000;display:flex;align-items:flex-end;justify-content:center;padding:0;background:rgba(2,16,10,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.sheet{width:100%;max-width:560px;max-height:92dvh;display:flex;flex-direction:column;background:var(--card-bg);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid color-mix(in srgb,var(--brand) 22%,var(--line));border-radius:26px 26px 0 0;box-shadow:0 1px 0 var(--gl-hi) inset,0 40px 90px -20px rgba(0,30,20,.55),0 0 40px -14px var(--glow)}
:root[data-theme="dark"] .sheet{background:var(--surface)}
:root[data-theme="light"] .sheet{background:color-mix(in srgb,var(--surface) 94%,transparent)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 8px}
.sheet-h h3{font-size:17px;font-weight:700}
.sheet-b{padding:6px 18px 18px;overflow:auto;flex:1}
.sheet-f{display:flex;gap:10px;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-f .btn{flex:1}
@media(min-width:700px){.overlay{align-items:center;padding:20px}.sheet{border-radius:26px}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--elev)}
.opt span{font-size:12px;color:var(--ink-2)}.opt.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset,0 0 18px -6px var(--glow)}
.toasts{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom));z-index:200000;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{display:flex;align-items:center;gap:10px;max-width:440px;padding:12px 16px;border-radius:16px;background:#10213d;color:#fff;font-weight:700;font-size:13.5px;box-shadow:0 12px 32px rgba(0,0,0,.35);animation:tin .22s ease both}
.toast.err{background:#5a1f19}.toast.ok{background:#0f3d2b}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--brand);animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* login */
.auth{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;overflow:hidden}
.auth::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 12%,color-mix(in srgb,var(--neon) 35%,transparent) 0,transparent 55%),linear-gradient(180deg,transparent,color-mix(in srgb,var(--neon) 10%,transparent))}
.auth .fx3d{width:230px;height:190px;margin-bottom:-14px;filter:drop-shadow(0 18px 16px rgba(4,70,50,.3))}
.auth .logo{width:70px;height:70px;border-radius:22px;box-shadow:var(--sh-big)}
.auth h1{font-size:26px;font-weight:800;text-align:center;background:linear-gradient(90deg,var(--brand),var(--accent),var(--neon));-webkit-background-clip:text;background-clip:text;color:transparent}
.auth form{width:100%;max-width:360px;padding:18px;border-radius:26px;background:var(--card-bg);border:1px solid var(--line);box-shadow:var(--sh-big);backdrop-filter:blur(14px)}
.auth .err{color:var(--bad);font-weight:700;font-size:13px;min-height:18px;text-align:center}

/* sesi berjalan */
.live{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.timer{position:relative;width:230px;height:230px;display:grid;place-items:center}
.timer svg{position:absolute;inset:0;transform:rotate(-90deg);filter:drop-shadow(0 0 10px var(--glow))}
.timer .tm{font-family:var(--font-h);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.rpe button{min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--elev);font-weight:700;box-shadow:var(--press)}
.rpe button.on{background:var(--grad);color:var(--on-grad);border-color:transparent;box-shadow:var(--sh-btn)}

/* kuitansi (tetap putih, dicetak) */
.receipt{max-width:480px;margin:0 auto;background:#fff;color:#1a1412;border-radius:18px;padding:24px;box-shadow:var(--sh-big);position:relative}
.receipt h2{font-size:20px}.receipt .no{font-family:var(--font-h);font-weight:800;color:#047857}
:root[data-pal="red"] .receipt .no{color:#b62e20}
.receipt .kv dt{color:#6b5f59}.receipt hr{border:0;border-top:1px dashed #cfc3bb;margin:14px 0}
.receipt .void{position:absolute;inset:0;display:grid;place-items:center;font-size:54px;font-weight:900;color:rgba(192,57,43,.25);transform:rotate(-18deg);pointer-events:none}
@media print{.top,.bnav,.side,.fab,.noprint,.nb-shapes{display:none!important}body{background:#fff}body::before{display:none}.view{padding:0}.receipt{box-shadow:none}}

/* mode hemat & aksesibilitas */
body[data-fx="lite"] .nb-shapes{display:none}
body[data-fx="lite"] .card,body[data-fx="lite"] .kpi,body[data-fx="lite"] .item,body[data-fx="lite"] .bnav,body[data-fx="lite"] .top,body[data-fx="lite"] .sheet,body[data-fx="lite"] .auth form{backdrop-filter:none;-webkit-backdrop-filter:none}
body[data-fx="lite"] .view.enter>*,body[data-fx="lite"] .progress>i::after,body[data-fx="lite"] .item:hover .avatar::before,body[data-fx="lite"] .item:hover .avatar::after{animation:none}
body[data-fx="lite"] .hero{transform:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:420px){.hero .fx3d{width:130px;right:-14px}.hero h2{font-size:22px}}

/* ===================================================================
   Lapisan "Fitness Energik": tipografi tebal, cincin progres, streak, lencana
   =================================================================== */
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-h);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.eyebrow.on{color:var(--neon)}
.eyebrow.on svg{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(1.2)}}
.big{font-family:var(--font-h);font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.big .num{font-size:30px}
.page-h{align-items:flex-end}
.page-h h2{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.ph-n{display:flex;flex-direction:column;align-items:center;padding:6px 14px;border-radius:16px;background:var(--grad);color:var(--on-grad);text-shadow:var(--on-grad-sh);box-shadow:var(--sh-btn);font-family:var(--font-h)}
.ph-n b{font-size:22px;font-weight:800;line-height:1}.ph-n small{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.sec-h h3{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.sec-h a{font-weight:700}

/* tombol besar untuk PT */
.btn.lg{min-height:50px;padding:0 22px;font-size:14.5px;font-weight:800;border-radius:16px}
.empty .eico{width:54px;height:54px;border-radius:18px;margin:0 auto 10px;display:grid;place-items:center;background:var(--subtle);color:var(--brand)}
.empty .eico .ic{width:26px;height:26px}

/* cincin progres */
.ring{position:relative;flex:none;display:inline-grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring-bg{stroke:var(--subtle)}
.ring-v{filter:drop-shadow(0 0 5px var(--glow));animation:ringin 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringin{from{stroke-dashoffset:var(--c)}}
.ring-c{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1;text-align:center}
.ring-c b{font-family:var(--font-h);font-weight:800;font-size:calc(var(--rs,1) * 15px);letter-spacing:-.03em}
.ring-c b span{font-size:.62em;font-weight:700;opacity:.55}
.ring-c small{font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.ring[style*="96px"] .ring-c b{font-size:24px}.ring[style*="118px"] .ring-c b{font-size:28px}
.ring[style*="96px"] .ring-c small,.ring[style*="118px"] .ring-c small{font-size:10px;margin-top:4px}
.ring.warn .ring-v{stroke:#f59e0b;filter:drop-shadow(0 0 5px #f59e0b)}.ring.warn .ring-c b{color:var(--warn)}
.ring.idle .ring-v{display:none}.ring.idle .ring-c b{color:var(--ink-3)}

/* hero coach */
.hero.coach{min-height:178px;padding:20px 20px 18px;background:var(--hero);background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 2px,transparent 2px 16px),var(--hero)}
.hero.coach h2{font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.035em;margin:6px 0 10px;max-width:70%}
.hero.coach .quote{font-size:12.5px;font-style:italic;font-weight:500;opacity:.94;max-width:72%;line-height:1.4}
.hero.coach .lbl{font-weight:700;letter-spacing:.14em;font-size:10.5px}
@media(max-width:420px){.hero.coach h2{font-size:26px}}

/* hari ini */
.card.today{margin-top:12px;padding:16px;border-radius:22px}
.card.today .row{align-items:center}
.nextup{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px;border-radius:18px;background:var(--subtle);border:1px solid var(--line);box-shadow:var(--press)}
.nx-time{display:flex;flex-direction:column;align-items:center;min-width:56px;padding:6px 8px;border-radius:13px;background:var(--grad);color:var(--on-grad);text-shadow:var(--on-grad-sh);box-shadow:var(--sh-btn);font-family:var(--font-h)}
.nx-time b{font-size:17px;font-weight:800;line-height:1.1}.nx-time small{font-size:8px;font-weight:800;letter-spacing:.1em}
.nextup .t{font-weight:800;font-size:15px;font-family:var(--font-h)}.nextup .d{font-size:12px;color:var(--ink-2);margin-top:2px;display:flex;align-items:center;gap:4px}
.nextup .btn{flex:none}
@media(max-width:380px){.nextup{flex-wrap:wrap}.nextup .btn{width:100%}}

/* streak */
.card.streak{margin-top:12px}
.flame{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(160deg,#fbbf24,#f97316 55%,#e11d48);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 -3px 5px rgba(120,20,0,.3) inset,0 10px 18px -8px #f97316}
.flame .ic{width:26px;height:26px;fill:rgba(255,255,255,.25);filter:drop-shadow(0 2px 2px rgba(120,20,0,.4))}
.wdots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wdots span{display:flex;flex-direction:column;align-items:center;gap:4px}
.wdots i{width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--subtle);color:#fff;box-shadow:var(--press)}
.wdots i .ic{width:15px;height:15px;stroke-width:3}
.wdots .on i{background:var(--grad);box-shadow:var(--sh-btn);color:var(--on-grad)}
.wdots .today i{outline:2px solid var(--brand);outline-offset:2px}
.wdots small{font-size:10px;font-weight:700;color:var(--ink-3)}.wdots .today small{color:var(--brand)}
a.alertc{margin-top:12px;color:inherit;border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}

/* lencana */
.medals{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.medals::-webkit-scrollbar{display:none}
.medal{flex:none;width:96px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding:12px 6px;border-radius:18px;background:var(--card-bg);border:1px solid var(--line);box-shadow:var(--sh-card)}
.medal b{font-family:var(--font-h);font-size:11.5px;font-weight:800;line-height:1.2}.medal small{font-size:10px;color:var(--ink-3);font-weight:600}
.mhex{width:52px;height:56px;display:grid;place-items:center;color:var(--ink-3);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--subtle)}
.mhex .ic{width:24px;height:24px}
.medal.on .mhex{color:#fff;background:linear-gradient(160deg,#fde68a,#f59e0b 55%,#d97706);filter:drop-shadow(0 6px 8px rgba(217,119,6,.4))}
.medal.on .mhex .ic{filter:drop-shadow(0 1px 1px rgba(120,60,0,.5));fill:rgba(255,255,255,.2)}
.medal.on small{color:var(--ok);font-weight:700}
.medal:not(.on){opacity:.75}

/* kartu sesi */
.sx{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 14px 12px 16px;border-radius:20px;background:var(--card-bg);border:1px solid color-mix(in srgb,var(--brand) 14%,var(--line));box-shadow:var(--sh-card);overflow:hidden}
.sx::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--ink-3)}
.sx.st-completed::before{background:linear-gradient(180deg,#6ee7b7,#059669)}.sx.st-scheduled::before{background:linear-gradient(180deg,#93c5fd,#2563eb)}.sx.st-check_in::before{background:linear-gradient(180deg,#fde68a,#f97316);box-shadow:0 0 14px #f59e0b}
.sx.st-cancelled::before,.sx.st-no_show::before{background:linear-gradient(180deg,#fda4af,#e11d48)}
.sx.st-check_in{border-color:color-mix(in srgb,#f59e0b 50%,var(--line))}
.sx-time{display:flex;flex-direction:column;align-items:center;min-width:52px;padding-left:2px}
.sx-time b{font-family:var(--font-h);font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.1}.sx-time small{font-size:10px;font-weight:700;color:var(--ink-3);margin-top:2px;text-align:center}
.sx-main{min-width:0}.sx-t{font-family:var(--font-h);font-weight:800;font-size:15px;overflow-wrap:anywhere}
.sx-d{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--ink-2);margin-top:3px}
.pgm{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--brand)}
.sx-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.sx-a{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line-2)}
.sx-a .btn.primary{flex:1}.sx-a .btn:not(.primary):not(.icon-btn){flex:1}

/* kartu klien */
.item.cc{padding:12px 14px}
.cc-b{margin-top:6px}
.chip em{font-style:normal;margin-left:4px;padding:1px 7px;border-radius:99px;font-size:10.5px;background:color-mix(in srgb,var(--brand) 14%,transparent)}
.chip.on em{background:rgba(255,255,255,.3)}

/* detail klien */
.avatar.big{width:60px;height:60px;font-size:20px;margin:6px 8px 6px 6px}
.avatar.big::after{transform-origin:50% calc(30px + 10.5px)}
.card.ch{padding:16px;border-radius:24px}
.ch-top{display:flex;align-items:center;gap:10px}.ch-top h2{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.pill{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;background:var(--info-bg);color:var(--brand);border:1px solid color-mix(in srgb,var(--brand) 25%,transparent)}
.ch-ring{display:flex;align-items:center;gap:18px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-2)}
.ch-stats{flex:1;display:grid;gap:10px;min-width:0}
.ch-stats div{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ch-stats b{font-family:var(--font-h);font-size:18px;font-weight:800;letter-spacing:-.02em}.ch-stats b.bad{color:var(--bad)}.ch-stats b.good{color:var(--ok)}
.ch-stats small{font-size:11px;font-weight:600;color:var(--ink-2);order:-1}
.qa{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin-top:12px}
.qa-i{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:18px;background:var(--card-bg);border:1px solid var(--line);box-shadow:var(--sh-card);font-family:var(--font-h);font-weight:700;font-size:12px;color:var(--ink)}
.qa-i .ic{width:24px;height:24px;color:var(--brand);padding:0}
.qa-i:active{transform:translateY(2px) scale(.97)}

/* jadwal */
.weekbar{gap:6px;margin-bottom:14px}
.weekbar button{padding:10px 0 8px;border-radius:18px}
.weekbar button b{font-size:17px;font-weight:800}
.weekbar button.on{transform:translateY(-3px)}

/* sesi berjalan */
.live2{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-bottom:110px}
.lv-head{position:relative;width:100%;padding:18px 16px 16px;border-radius:24px;color:#fff;background:var(--hero);background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 2px,transparent 2px 16px),var(--hero);box-shadow:0 24px 50px -18px var(--glow);overflow:hidden;text-align:left}
.lv-head .fx3d{position:absolute;right:-8px;top:-4px;width:130px;height:100%;pointer-events:none}
.lv-head .eyebrow{color:#fff;opacity:.9}.lv-head h2{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:6px 0 8px;max-width:68%}
.lv-head .pgm{color:#fff;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:99px;font-size:11.5px}
.live2 .timer{width:236px;height:236px}
.live2 .timer svg{transform:rotate(-90deg)}
.live2 .timer .tm{font-size:50px;font-weight:800;letter-spacing:-.04em}
.tmsub{position:absolute;bottom:62px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.lvc{width:100%;text-align:left;display:flex;flex-direction:column;gap:16px}
.qn{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.rpe{gap:6px}
.rpe button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;padding:6px 2px}
.rpe button b{font-family:var(--font-h);font-size:20px;font-weight:800}.rpe button small{font-size:9.5px;font-weight:700;opacity:.8;line-height:1.1}
.lv-bar{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;flex-direction:column;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
@media(min-width:900px){.lv-bar{left:250px}}
.lv-bar .btn{max-width:560px;margin:0 auto;width:100%}
body[data-fx="lite"] .ring-v,body[data-fx="lite"] .eyebrow.on svg{animation:none}

.nextup .btn.lg{min-height:46px;padding:0 16px}
.nextup .grow{min-width:0}
.nextup .t{overflow-wrap:anywhere}
.wdots{max-width:440px}

/* ===== NEON MERAH · HITAM · PUTIH (palet tunggal) ===== */
:root[data-pal="red"][data-theme="dark"]{
  color-scheme:dark;
  --brand:#ff2a3c;--brand-2:#e11d2e;--neon:#ff2a3c;--accent:#ffffff;--glow:rgba(255,42,60,.5);--glow-solid:#ff2a3c;
  --bg:#050505;--surface:#0e0b0b;--elev:#151010;--subtle:#1c1313;
  --line:#2a1618;--line-2:#43202a;
  --ink:#ffffff;--ink-2:#c4b3b5;--ink-3:#7f6c6f;
  --grad:linear-gradient(180deg,#ff5260 0%,#ff2a3c 45%,#d4101f 100%);
  --hero:linear-gradient(145deg,#000 0%,#1a0508 55%,#5a0a14 100%);
  --on-grad:#fff;--on-grad-sh:0 1px 1px rgba(80,0,10,.55);
  --grid:rgba(255,42,60,.07);--b1:rgba(255,42,60,.20);--b2:rgba(255,255,255,.04);--b3:rgba(255,42,60,.10);
  --card-bg:linear-gradient(160deg,rgba(24,14,15,.92),rgba(10,7,7,.88));
  --dock-bg:linear-gradient(180deg,rgba(18,10,11,.9),rgba(6,4,4,.94));
  --sh-card:0 1px 1px rgba(255,255,255,.08) inset,0 8px 18px -10px rgba(0,0,0,.8);
  --sh-big:0 1px 1px rgba(255,255,255,.12) inset,0 18px 40px -12px rgba(0,0,0,.85),0 0 26px -10px rgba(255,42,60,.35);
  --sh-btn:0 1px 0 rgba(255,255,255,.45) inset,0 -3px 0 rgba(110,0,15,.45) inset,0 0 24px rgba(255,42,60,.55),0 8px 20px rgba(0,0,0,.6);
  --fx1:#ff5260;--fx2:#ffffff;--fx3:#ffc2c8;
}
:root[data-pal="red"][data-theme="light"]{
  color-scheme:light;
  --brand:#e11d2e;--brand-2:#b9121f;--neon:#e11d2e;--accent:#111111;--glow:rgba(225,29,46,.34);--glow-solid:#e11d2e;
  --bg:#f6f4f4;--surface:#ffffff;--elev:#faf8f8;--subtle:#efeaea;
  --line:#e6dddd;--line-2:#d3c3c5;
  --ink:#0b0b0b;--ink-2:#55494b;--ink-3:#968a8c;
  --grad:linear-gradient(180deg,#ff4d5c 0%,#e11d2e 50%,#b9121f 100%);
  --hero:linear-gradient(145deg,#050505 0%,#1a0508 55%,#5a0a14 100%);
  --on-grad:#fff;--on-grad-sh:0 1px 1px rgba(80,0,10,.5);
  --grid:rgba(225,29,46,.05);--b1:rgba(225,29,46,.12);--b2:rgba(0,0,0,.03);--b3:rgba(225,29,46,.06);
  --card-bg:linear-gradient(160deg,rgba(255,255,255,.98),rgba(250,246,246,.9));
  --dock-bg:linear-gradient(180deg,rgba(14,10,10,.94),rgba(5,4,4,.96));
  --sh-card:0 1px 0 #fff inset,0 6px 16px -10px rgba(60,10,16,.3);
  --sh-big:0 1px 0 #fff inset,0 16px 34px -12px rgba(60,10,16,.25);
  --sh-btn:0 1px 0 rgba(255,255,255,.5) inset,0 -3px 0 rgba(110,0,15,.35) inset,0 10px 22px -6px var(--glow),0 3px 6px rgba(80,0,10,.3);
  --fx1:#ff4d5c;--fx2:#ffffff;--fx3:#ffc2c8;
}
/* dok gelap di kedua tema */
.bnav a{color:#cbbcbe}.bnav a.on{color:#fff}
:root[data-pal="red"][data-theme="light"] .bnav{border-color:rgba(255,255,255,.08)}
/* hero hologram */
.hero.holo{min-height:250px;padding:18px 18px 16px;color:#fff;background:radial-gradient(120% 90% at 85% 40%,rgba(255,42,60,.28),transparent 60%),linear-gradient(145deg,#000 0%,#14060a 60%,#3a0710 100%);border:1px solid rgba(255,42,60,.28)}
.hero.holo::before{display:none}
.hero.holo::after{background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px);opacity:1}
.hero.holo .fx3d{right:-6px;top:0;width:52%;height:100%;min-height:250px}
.hero.holo>*:not(.fx3d){position:relative;z-index:2}
.hero.holo .lbl{font-size:10.5px;letter-spacing:.16em;font-weight:700;opacity:.8}
.hero.holo h2{font-size:15px;font-weight:600;margin:2px 0 14px;max-width:55%;opacity:.9;text-shadow:none}
.hero.holo .rev-l{font-size:10.5px;letter-spacing:.16em;font-weight:700;color:var(--neon)}
.hero.holo .rev{font-family:var(--font-h);font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:2px 0 6px;text-shadow:0 0 22px rgba(255,42,60,.55);white-space:nowrap}
.hero.holo .delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.1)}
.hero.holo .delta.up{color:#7dffb0}.hero.holo .delta.dn{color:#ffb3ba}
.hero.holo .chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;max-width:62%}
.hero.holo .chip2{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,42,60,.18);border:1px solid rgba(255,42,60,.45);color:#fff;text-decoration:none}
.hero.holo .quote{font-size:11.5px;opacity:.75;margin-top:10px;max-width:56%;font-style:italic}
@media(max-width:380px){.hero.holo .rev{font-size:26px}}
.fx-svg{position:absolute;right:6px;top:8px;height:calc(100% - 16px);width:auto;max-width:48%}
.fx-svg.wide{position:static;width:100%;height:100%;max-width:none}
.card.studio{padding:14px 14px 6px}
.card.studio .fx3d{position:relative;height:210px;margin:0 -6px}
.card.studio .legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-2);padding:2px 4px 8px}
.card.studio .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--neon)}
.card.studio .legend i.g{background:#6b5658}
/* aktivitas klien */
.act-h{display:flex;gap:8px;margin:0 0 10px}
.act-h button{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.act-h button b{font-family:var(--font-h);font-size:22px;line-height:1}
.act-h button small{font-size:11.5px;color:var(--ink-2)}
.act-h button.on{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon) inset,0 0 18px -6px var(--glow)}
.act-r{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none}
.act-r .when{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--subtle);color:var(--ink-2);white-space:nowrap}
.act-r .when.hot{background:rgba(255,42,60,.16);color:var(--neon)}
.act-r .when.cold{background:var(--bad-bg);color:var(--bad)}
.kpis4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* dok melayang + tombol tengah besar */
.bnav.fabnav{grid-auto-flow:unset;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:end;overflow:visible}
.bnav .cfab{position:relative;display:flex;align-items:center;justify-content:center;width:64px;height:64px;margin:-30px auto 2px;border-radius:50%;border:3px solid #050505;background:var(--grad);color:#fff;box-shadow:var(--sh-btn);cursor:pointer;padding:0;transition:transform .2s}
.bnav .cfab:active{transform:scale(.93)}
.bnav .cfab .ic{width:28px;height:28px}
.bnav .cfab::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid var(--neon);opacity:.5;animation:cfp 2.4s ease-out infinite}
@keyframes cfp{0%{transform:scale(.85);opacity:.6}100%{transform:scale(1.25);opacity:0}}
body[data-fx="lite"] .bnav .cfab::after{animation:none;display:none}
.qa-list{display:grid;gap:8px}
.qa-list .item{cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.kpis .kpi,.kpis4 .kpi{--ka:#ff9aa4;--kb:#ff2a3c;--kd:#8f0c18}
.kpis4 .kpi:nth-child(2n){--ka:#ffffff;--kb:#d9d9d9;--kd:#777}
.avatar.c1{--a:#ff8a95;--b:#ff2a3c;--d:#8f0c18;--o:#fff}
.avatar.c2{--a:#ffffff;--b:#cfcfcf;--d:#555;--o:#ff2a3c}
.avatar.c3{--a:#ff5260;--b:#d4101f;--d:#5a0a14;--o:#fff}
.avatar.c4{--a:#555;--b:#222;--d:#000;--o:#ff2a3c}
.avatar.c5{--a:#ffb3ba;--b:#e11d2e;--d:#6d0813;--o:#fff}
.avatar.c6{--a:#e6e6e6;--b:#8a8a8a;--d:#2a2a2a;--o:#ff2a3c}
@media(max-width:899px){.fab:not(.keep){display:none!important}}
.kpis .kpi:nth-child(n){--ka:#ff9aa4;--kb:#ff2a3c;--kd:#8f0c18}
.kpis .kpi:nth-child(2n){--ka:#ffffff;--kb:#d9d9d9;--kd:#777}

/* ===== Animasi logo pemuatan ===== */
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(70% 55% at 50% 42%,rgba(255,42,60,.22),transparent 70%),#050505;color:#fff;opacity:1;transition:opacity .45s ease,transform .45s ease;overflow:hidden}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash.in{animation:spIn .35s ease both}
@keyframes spIn{from{opacity:0}to{opacity:1}}
.sp-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,42,60,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,42,60,.08) 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(circle at 50% 45%,#000 0,transparent 65%);-webkit-mask-image:radial-gradient(circle at 50% 45%,#000 0,transparent 65%);animation:spGrid 6s linear infinite}
@keyframes spGrid{to{background-position:0 34px,34px 0}}
.sp-core{position:relative;width:132px;height:132px;display:grid;place-items:center}
.sp-core img{position:relative;width:88px;height:88px;border-radius:26px;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 40px rgba(255,42,60,.55);animation:spPop .9s cubic-bezier(.2,1.3,.3,1) both,spBeat 1.8s ease-in-out .9s infinite}
@keyframes spPop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes spBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.sp-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,#ff2a3c 85%,#fff 100%);-webkit-mask:radial-gradient(circle,transparent 61px,#000 62px,#000 65px,transparent 66px);mask:radial-gradient(circle,transparent 61px,#000 62px,#000 65px,transparent 66px);animation:spSpin 1.5s linear infinite}
.sp-ring.r2{inset:10px;opacity:.6;animation-duration:2.4s;animation-direction:reverse;-webkit-mask:radial-gradient(circle,transparent 51px,#000 52px,#000 54px,transparent 55px);mask:radial-gradient(circle,transparent 51px,#000 52px,#000 54px,transparent 55px)}
@keyframes spSpin{to{transform:rotate(360deg)}}
.sp-pulse{position:absolute;inset:14px;border-radius:50%;border:1.5px solid #ff2a3c;opacity:0;animation:spWave 2.2s ease-out infinite}
.sp-pulse.p2{animation-delay:1.1s}
@keyframes spWave{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.sp-scan{position:absolute;left:22px;right:22px;top:22px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 12px 2px #ff2a3c;animation:spScan 1.7s ease-in-out infinite}
@keyframes spScan{0%,100%{transform:translateY(0);opacity:0}15%,85%{opacity:1}50%{transform:translateY(86px)}}
.sp-name{font-family:var(--font-h,Sora,system-ui,sans-serif);font-weight:800;font-size:17px;letter-spacing:.34em;padding-left:.34em;animation:spUp .8s .3s cubic-bezier(.2,.8,.2,1) both}
.sp-name span{color:#ff2a3c;text-shadow:0 0 18px rgba(255,42,60,.7)}
@keyframes spUp{from{opacity:0;transform:translateY(10px);letter-spacing:.6em}to{opacity:1;transform:none;letter-spacing:.34em}}
.sp-bar{position:relative;width:min(220px,56vw);height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.sp-bar i{position:absolute;inset:0 auto 0 0;width:40%;border-radius:3px;background:linear-gradient(90deg,#ff2a3c,#fff);box-shadow:0 0 10px #ff2a3c;animation:spBar 1.3s ease-in-out infinite}
@keyframes spBar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.sp-msg{font-size:12px;letter-spacing:.08em;color:rgba(255,255,255,.62);min-height:16px}
@media(prefers-reduced-motion:reduce){#splash *{animation-duration:.01ms!important;animation-iteration-count:1!important}.sp-ring{animation:none}.sp-bar i{width:100%}}
body[data-fx="lite"] .sp-grid{animation:none}

/* ===== iOS: cegah zoom otomatis & 3D poster hidup ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden}
input,select,textarea,.inp,.fld input,.fld select,.fld textarea,.search input{font-size:16px}
.fx-svg{left:50%;right:auto;transform:translateX(-50%);max-width:none;width:auto}
.fx-svg.wide{left:auto;transform:none;width:100%}
.fxprev{height:220px;margin-top:10px;border-radius:18px;background:radial-gradient(70% 60% at 50% 50%,rgba(255,42,60,.2),transparent 70%),#080505;border:1px solid var(--line-2);overflow:hidden}
.auth .fx3d{width:min(320px,86vw);height:270px;margin-bottom:-10px;filter:none}
.auth .fx3d::before{content:"";position:absolute;inset:8% 6%;border-radius:50%;background:radial-gradient(circle,rgba(255,42,60,.28),transparent 68%);pointer-events:none}
.holo-svg .hs-body{filter:drop-shadow(0 0 5px var(--neon));animation:hsPulse 2.4s ease-in-out infinite}
.holo-svg .hs-scan{animation:hsScan 2.6s ease-in-out infinite}
.holo-svg .hs-ring{animation:hsRing 2.6s ease-in-out infinite;transform-origin:60px 193px}
.holo-svg .hs-dots{animation:hsPulse 1.6s ease-in-out infinite}
@keyframes hsScan{0%{transform:translateY(-8px)}100%{transform:translateY(205px)}}
@keyframes hsPulse{0%,100%{opacity:.78}50%{opacity:1}}
@keyframes hsRing{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.18);opacity:1}}
.fx-logo-poster{position:absolute;inset:0;display:grid;place-items:center}
.fx-logo-poster img{width:46%;max-width:130px;border-radius:24%;box-shadow:0 0 36px rgba(255,42,60,.6);animation:lpFloat 3.2s ease-in-out infinite;position:relative}
.fx-logo-poster .lp-ring{position:absolute;width:62%;aspect-ratio:1;border-radius:50%;border:2px solid transparent;border-top-color:var(--neon);border-right-color:rgba(255,255,255,.7);animation:spSpin 2.2s linear infinite}
.fx-logo-poster .lp-ring.r2{width:78%;opacity:.5;animation-duration:3.6s;animation-direction:reverse}
@keyframes lpFloat{0%,100%{transform:translateY(-4px) rotateY(-12deg)}50%{transform:translateY(5px) rotateY(12deg)}}
@media(prefers-reduced-motion:reduce){.holo-svg *,.fx-logo-poster *{animation:none!important}}

</style>
</head>

const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

function toast(msg, kind = 'ok') {
  let box = $('#toasts'); if (!box) { box = document.createElement('div'); box.id = 'toasts'; box.className = 'toasts'; document.body.appendChild(box); }
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.setAttribute('role', 'status');

/** Hubungkan <label> dengan kontrolnya (aksesibilitas) di dalam root. */
let _lid = 0;
function linkLabels(root) {

}

function openSheet({ title, body, footer = '', onMount, wide }) {
  const ov = document.createElement('div'); ov.className = 'overlay'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
  ov.innerHTML = `<div class="sheet"${wide ? ' style="max-width:680px"' : ''}><div class="sheet-h"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Tutup">${ic('x')}</button></div><div class="sheet-b">${body}</div>${footer ? `<div class="sheet-f">${footer}</div>` : ''}</div>`;
  document.body.appendChild(ov); document.body.style.overflow = 'hidden'; linkLabels(ov);
  const close = () => { ov.remove(); if (!$('.overlay')) document.body.style.overflow = ''; };
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  ov.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });
  if (onMount) onMount(ov, close);
  return { el: ov, close };
}
function confirmDlg({ title, message, okText = 'Ya', danger = false }) {
  return new Promise(res => {
    const s = openSheet({ title, body: `<p class="muted">${esc(message)}</p>`, footer: `<button class="btn" data-close>Batal</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(okText)}</button>` });
    s.el.addEventListener('click', e => { if (e.target.closest('[data-ok]')) { s.close(); res(true); } else if (e.target.closest('[data-close]')) res(false); });
  });
}
/** Jalankan aksi async dengan tombol terkunci + toast hasil. */
async function act(btn, fn, okMsg) {
  if (btn) btn.disabled = true;
  try { const r = await fn(); if (okMsg) toast(okMsg); return { ok: true, data: r }; }
  catch (e) { toast(errMsg(e), 'err'); return { ok: false, error: e }; }
  finally { if (btn) btn.disabled = false; }
}
const rpcRemote = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; };
/** Mode langsung: operasi tabel (tanpa fungsi database app_*). Lihat direct.js */
const rpc = (fn, args) => (typeof DIRECT !== 'undefined' && DIRECT[fn]) ? DIRECT[fn](args || {}) : rpcRemote(fn, args);

'use strict';
/* ======================= Mode langsung: operasi tabel tanpa fungsi database =======================
   Dipakai bila database belum memiliki fungsi app_* (migrasi 0200). Nomor kuitansi, status bayar, dan
   used_sessions diisi oleh trigger yang sudah ada di database. Aturan peran dijaga di aplikasi. */
const need = r => { if (r.error) throw r.error; return r.data; };
const one = r => { const d = need(r); if (!d || !d.length) throw new Error('Data tidak ditemukan atau tidak bisa diubah'); return d[0]; };
const nowIso = () => new Date().toISOString();
const need_admin = m => { if (!isAdmin()) throw new Error(m || 'Hanya Admin yang dapat melakukan ini'); };
const need_writer = () => { if (!canWrite()) throw new Error('Hanya Admin atau PT yang dapat melakukan ini'); };
const monthTag = m => `Billing Pascabayar: ${m}`;
const rpFmt = n => 'Rp ' + Math.round(num(n)).toLocaleString('id-ID');
const nn = v => (v === '' || v === undefined) ? null : v;
const ownSession = async id => {
  const s = one(await sb.from('workout_sessions').select('*').eq('id', id).limit(1));
  if (isPT() && s.trainer_id !== S.trainerId) throw new Error('Sesi ini bukan milik Anda');
  return s;
};
async function freshPaid(pkgId, month) {
  const t = need(await sb.from('pt_transactions').select('amount,kind,payment_status,voided_at,notes').eq('package_id', pkgId));
  const live = t.filter(x => !x.voided_at && (x.payment_status === 'paid' || x.payment_status === 'partial'));
  if (month) return live.filter(x => (x.notes || '').includes(monthTag(month))).reduce((a, x) => a + num(x.amount), 0);
  return live.reduce((a, x) => a + (x.kind === 'refund' ? -num(x.amount) : num(x.amount)), 0);
}
async function insertPayment(pkgId, amount, notes, month) {
  const p = one(await sb.from('pt_packages').select('*').eq('id', pkgId).limit(1));
  const post = isPostpaid(p);
  if (!(amount > 0)) throw new Error('Jumlah harus lebih dari 0');
  if (post && !month) throw new Error('Pilih bulan tagihan pascabayar');
  if (!post) {
    const out = Math.max(num(p.total_price) - await freshPaid(pkgId), 0);
    if (amount > out) throw new Error(`Pembayaran melebihi sisa tagihan (sisa ${rpFmt(out)})`);
  } else {
    const ses = need(await sb.from('workout_sessions').select('scheduled_at,status,counts_toward_balance').eq('package_id', pkgId));
    const n = ses.filter(s => ym(s.scheduled_at) === month && isCounted(s)).length;
    const out = Math.max(n * num(p.price_per_session) - await freshPaid(pkgId, month), 0);
    if (amount > out) throw new Error(`Pembayaran melebihi tagihan bulan ini (sisa ${rpFmt(out)})`);
  }
  const noteTxt = [post ? monthTag(month) : null, nn(notes)].filter(Boolean).join(' · ') || null;
  const row = one(await sb.from('pt_transactions').insert({ package_id: p.id, trainer_id: p.trainer_id, client_id: p.client_id, amount, payment_status: 'paid', payment_date: nowIso(), notes: noteTxt, kind: 'payment', created_by: S.me.id }).select('id,receipt_number'));
  return { transaction_id: row.id, receipt_number: row.receipt_number };
}

'use strict';
/* ======================= 3D hidup: hologram tubuh atletik + scene data. Tiga tingkat kualitas, mode hemat = SVG ======================= */
const FX = (() => {
  const KEY = 'elp.3d';
  const TIERS = {
    high:   { label: 'Tinggi', dpr: 1.75, aa: true,  sparks: 70, rad: 14, extras: true,  webgl: true },
    medium: { label: 'Sedang', dpr: 1.25, aa: false, sparks: 24, rad: 10, extras: true,  webgl: true },
    low:    { label: 'Hemat',  dpr: 1,    aa: false, sparks: 0,  rad: 8,  extras: false, webgl: false },
  };
  const FPS_FLOOR = 40;
  let mode = 'auto', detected = null, downgraded = null, why = '', style = 'auto';
  const SKEY = 'elp.3dstyle';
  try { const m = localStorage.getItem(SKEY); if (['auto', 'body', 'logo', 'barbell'].includes(m)) style = m; } catch { }
  try { const m = localStorage.getItem(KEY); if (['auto', 'high', 'medium', 'low'].includes(m)) mode = m; } catch { }

  function detect() {
    try {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { why = 'Mode "Kurangi gerakan" di HP aktif'; return 'low'; }
      if (navigator.connection && navigator.connection.saveData) { why = 'Penghemat data aktif'; return 'low'; }
      if (!window.THREE) { why = 'Pustaka 3D gagal dimuat (cek internet)'; return 'low'; }
      const c = document.createElement('canvas');
      const gl = c.getContext('webgl2') || c.getContext('webgl');
      if (!gl) { why = 'WebGL tidak tersedia di browser ini'; return 'low'; }
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      const rd = dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)) : '';
      const lose = gl.getExtension('WEBGL_lose_context'); if (lose) lose.loseContext();
      if (/swiftshader|llvmpipe|software/i.test(rd)) { why = 'Tanpa akselerasi GPU'; return 'low'; }
      const cores = navigator.hardwareConcurrency || 4, mem = navigator.deviceMemory || 4, coarse = matchMedia('(pointer: coarse)').matches;
      let score = 0; if (cores >= 8) score++; if (mem >= 8) score++; if (!coarse) score++; if (cores >= 6) score++;
      const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (score >= 3) return 'high';
      if (ios || (score >= 1 && cores >= 4)) return 'medium';
      why = 'Perangkat dinilai terbatas'; return 'low';
    } catch (e) { why = 'Deteksi gagal'; return 'low'; }
  }
  const tier = () => { if (mode !== 'auto') return mode; if (!detected) detected = detect(); return downgraded || detected; };
  const cfg = () => TIERS[tier()];

  const insts = []; let rafId = 0, ptr = { x: 0, y: 0 }, tNow = 0, last = 0;
  let fps = { frames: 0, t: 0, warm: 0, slow: 0 };
  const cssHex = (name, fb) => { try { const c = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return c ? new THREE.Color(c).getHex() : fb; } catch { return fb; } };

  /* ---------- label teks sebagai sprite ---------- */
  function label(text, color, w, h) {
    const c = document.createElement('canvas'); c.width = 256; c.height = 64; const x = c.getContext('2d');
    x.font = '700 34px Sora,Manrope,system-ui,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = color; x.fillText(text, 128, 34);
    const t = new THREE.CanvasTexture(c); const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthTest: false }));
    s.scale.set(w || 1.5, h || .38, 1); return s;
  }

  /* ---------- hologram tubuh atletik ---------- */
  function buildBody(inst, live) {
    const T = THREE, k = cfg(), R = k.rad, red = cssHex('--glow-solid', 0xff2a3c);
    inst.camera.position.set(0, .05, 9.4); inst.camera.lookAt(0, 0, 0);
    const g = new T.Group(); inst.scene.add(g);
    const segs = [];
    const wm = () => new T.MeshBasicMaterial({ color: red, wireframe: true, transparent: true, opacity: .3 });
    const fm = () => new T.MeshBasicMaterial({ color: red, transparent: true, opacity: .08, depthWrite: false });
    const part = (geo, x, y, z, o = {}) => {
      const w = new T.Mesh(geo, wm()), f = new T.Mesh(geo, fm());
      [w, f].forEach(m => { m.position.set(x, y, z); m.rotation.set(o.rx || 0, 0, o.rz || 0); m.scale.set(o.sx || 1, o.sy || 1, o.sz || 1); g.add(m); });
      segs.push({ w, f, y });
    };
    const cyl = (a, b, h) => new T.CylinderGeometry(a, b, h, R, 3);
    const sph = r => new T.SphereGeometry(r, R, Math.max(6, R >> 1));
    part(sph(.27), 0, 1.97, 0, { sy: 1.15 });
    part(cyl(.1, .13, .28), 0, 1.68, 0);
    part(cyl(.56, .36, 1.0), 0, 1.1, 0, { sx: 1.18, sz: .72 });
    [-1, 1].forEach(s => part(sph(.27), s * .25, 1.3, .17, { sz: .62 }));
    part(cyl(.36, .33, .56), 0, .38, 0, { sx: 1.1, sz: .76 });
    part(sph(.4), 0, 0, 0, { sy: .66, sx: 1.12, sz: .8 });
    [-1, 1].forEach(s => {
      part(sph(.22), s * .68, 1.5, 0);
      part(cyl(.17, .13, .78), s * .86, 1.08, 0, { rz: s * .2 });
      part(cyl(.125, .085, .72), s * 1.0, .4, 0, { rz: s * .1 });
      part(sph(.1), s * 1.06, -.02, 0);
      part(cyl(.25, .17, 1.05), s * .25, -.62, 0, { rz: s * .03 });
      part(cyl(.17, .1, .98), s * .27, -1.65, 0);
      part(sph(.13), s * .28, -2.2, .1, { sz: 1.8, sy: .6 });
    });
    /* sendi bercahaya */
    const J = [[0, 1.65], [.68, 1.5], [-.68, 1.5], [.92, .72], [-.92, .72], [1.06, 0], [-1.06, 0], [.25, -.1], [-.25, -.1], [.26, -1.14], [-.26, -1.14], [.28, -2.1], [-.28, -2.1]];

/** Ambil seluruh baris (halaman 1000) dengan urutan stabil. */
async function fetchAll(table, orderCol) {
  let out = [], from = 0;
  for (; ;) {
    const { data, error } = await sb.from(table).select('*').order(orderCol, { ascending: true }).order('id', { ascending: true }).range(from, from + 999);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < 1000) break;
    from += 1000;
  }
  return out;
}
function indexAll() {
  M.user = Object.fromEntries(S.users.map(x => [x.id, x]));
  M.trainer = Object.fromEntries(S.trainers.map(x => [x.id, x]));
  M.client = Object.fromEntries(S.clients.map(x => [x.id, x]));
  M.pkg = Object.fromEntries(S.packages.map(x => [x.id, x]));
  M.trxById = Object.fromEntries(S.trx.map(x => [x.id, x]));
  M.sessById = Object.fromEntries(S.sessions.map(x => [x.id, x]));
}
/** Muat ulang tabel tertentu (atau semua). */
async function reload(...keys) {
  const ks = keys.length ? keys : Object.keys(TABLES);
  const raw = {};
  await Promise.all(ks.map(async k => { raw[k] = (k === 'reports' && isClient()) ? [] : await fetchAll(TABLES[k], ORDER[k]); }));
  if (S.me) {
    if (raw.trainers) S.trainerId = (raw.trainers.find(t => t.user_id === S.me.id) || {}).id || null;
    if (raw.clients) S.clientId = (raw.clients.find(c => c.user_id === S.me.id) || {}).id || null;
  }
  const ownTrainer = isClient() && S.clientId && raw.clients ? (raw.clients.find(c => c.id === S.clientId) || {}).trainer_id : (isClient() ? (S.clients.find(c => c.id === S.clientId) || {}).trainer_id : null);
  // RLS belum aktif di database: batasi data per peran di sisi aplikasi
  const scope = (k, rows) => {
    if (isAdmin() || !S.me) return rows;
    const tid = isPT() ? S.trainerId : ownTrainer;
    if (k === 'trainers') return rows.filter(r => r.id === tid);
    if (k === 'clients') return rows.filter(r => isPT() ? r.trainer_id === S.trainerId : r.id === S.clientId);
    if (k === 'banks') return rows.filter(r => r.trainer_id === tid);
    if (['packages', 'sessions', 'trx', 'reports'].includes(k)) return rows.filter(r => isPT() ? r.trainer_id === S.trainerId : r.client_id === S.clientId);
    return rows;
  };
  for (const k of ks) S[k] = scope(k, raw[k]);
  if (raw.reports) S.reports = S.reports.map(r => ({ ...r, proof_path: r.proof_url, period_month: ((r.notes || '').match(/Billing Pascabayar: (\d{4}-\d{2})/) || [])[1] || null, notes: (r.notes || '').replace(/Billing Pascabayar: \d{4}-\d{2}\s*/, '').trim() || null }));
  if (raw.users && S.me && !isAdmin()) {
    const ids = new Set([S.me.id, ...S.clients.map(c => c.user_id), ...S.trainers.map(t => t.user_id)]);
    S.users = S.users.filter(u => ids.has(u.id));
  }
  indexAll();
}

/* ---------- autentikasi ---------- */
const usernameToEmail = u => String(u || '').trim().toLowerCase() + '@pt.local';
async function login(username, password) {
  const { error } = await sb.auth.signInWithPassword({ email: usernameToEmail(username), password });
  if (error) throw new Error(/invalid/i.test(error.message) ? 'Username atau password salah' : error.message);
}
async function logout() { try { await sb.auth.signOut(); } catch { } S.loaded = false; S.me = null; location.hash = '#/login'; location.reload(); }
/** Muat profil + semua data. Mengembalikan false bila belum login / akun tidak aktif. */
async function bootSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return false;
  const { data: me, error } = await sb.from('users').select('*').eq('id', session.user.id).maybeSingle();
  if (error) throw error;
  if (!me || !me.is_active) { await sb.auth.signOut(); throw new Error('Akun tidak terdaftar atau tidak aktif. Hubungi Admin.'); }
  S.me = me; S.role = me.role;
  await reload();
  S.loaded = true;
  return true;
}
/** Buat akun login baru memakai klien sementara (tidak mengganti sesi Admin/PT yang aktif). */
async function createAuthAccount(username, password) {
  const tmp = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'elp-tmp-' + uuid() } });
  const email = usernameToEmail(username);
  const { data, error } = await tmp.auth.signUp({ email, password });
  if (error) {
    if (/already|registered|exists/i.test(error.message)) {
      // percobaan ulang setelah gagal di tengah jalan: pakai akun lama bila password sama
      const r = await tmp.auth.signInWithPassword({ email, password });
      if (r.error || !r.data.user) throw new Error('Username sudah digunakan');
      return r.data.user.id;
    }
    throw error;
  }
  if (!data.user || (data.user.identities && data.user.identities.length === 0)) throw new Error('Username sudah digunakan');
  return data.user.id;
}

const isPostpaid = p => !!p && (p.billing_type === 'postpaid' || /pascabayar|postpaid/i.test(p.package_name || ''));
const isCounted = s => s.status === 'completed' || ((s.status === 'cancelled' || s.status === 'no_show') && !!s.counts_toward_balance);
const STATUS = {
  scheduled: ['Terjadwal', 'info'], check_in: ['Berjalan', 'warn'], completed: ['Selesai', 'ok'],
  cancelled: ['Batal', 'bad'], no_show: ['No-show', 'bad'], rescheduled: ['Dijadwal ulang', ''],
};

const paidOf = pid => S.trx.filter(t => t.package_id === pid && !t.voided_at && (t.payment_status === 'paid' || t.payment_status === 'partial')).reduce((a, t) => a + (t.kind === 'refund' ? -num(t.amount) : num(t.amount)), 0);
const outstandingOf = p => isPostpaid(p) ? 0 : Math.max(num(p.total_price) - paidOf(p.id), 0);

const payBadge = p => { if (isPostpaid(p)) return '<span class="badge info">Pascabayar</span>'; const [l, k] = PAY[p.payment_status] || [p.payment_status, '']; return `<span class="badge ${k}">${esc(l)}</span>`; };

/** Tagihan pascabayar untuk satu bulan: sesi dihitung x tarif, dikurangi pembayaran bulan tsb. */
function monthBilling(pkg, month) {
  const sess = S.sessions.filter(s => s.package_id === pkg.id && ym(s.scheduled_at) === month && isCounted(s));
  const value = sess.length * num(pkg.price_per_session);
  const tag = `Billing Pascabayar: ${month}`;
  const paid = S.trx.filter(t => t.package_id === pkg.id && !t.voided_at && (t.notes || '').includes(tag)).reduce((a, t) => a + num(t.amount), 0);
  return { sessions: sess.length, value, paid, outstanding: Math.max(value - paid, 0) };
}
/** Total sisa tagihan klien: prabayar (sisa paket) + pascabayar bulan terpilih. */
function clientOutstanding(cid, month) {
  return activePkgs(cid).reduce((a, p) => a + (isPostpaid(p) ? monthBilling(p, month).outstanding : outstandingOf(p)), 0);
}
function clientRemainingSessions(cid) { return activePkgs(cid).filter(p => !isPostpaid(p)).reduce((a, p) => a + remainingOf(p), 0); }

async function route() {
  const token = ++renderToken;
  FX.detach();
  const h = here();
  if (!CONFIGURED) { renderSetup(); Splash.hide(); return; }
  if (!sb) { $('#app').innerHTML = '<div class="auth"><p class="muted">Pustaka Supabase gagal dimuat. Periksa koneksi internet lalu muat ulang.</p></div>'; Splash.hide(); return; }
  let found = null;
  for (const [key, re, fn, pub] of ROUTES) { const m = h.match(re); if (m) { found = { key, fn, pub, args: m.slice(1) }; break; } }
  if (!S.loaded) {
    $('#app').innerHTML = '<div class="spin"></div>';
    try { const ok = await bootSession(); if (!ok) { if (!(found && found.pub)) { history.replaceState(null, '', '#/login'); } renderPage(await pgLogin(), 'login', true); Splash.hide(); return; } }
    catch (e) { $('#app').innerHTML = `<div class="auth"><div class="note bad">${esc(errMsg(e))}</div><button class="btn" onclick="location.reload()">Coba lagi</button></div>`; Splash.hide(); return; }
    if (token !== renderToken) return;
  }
  if (!found || found.key === 'login') { history.replaceState(null, '', '#/dashboard'); return route(); }
  if (S.role === 'client' && ['pt', 'packages'].includes(found.key)) { history.replaceState(null, '', '#/dashboard'); return route(); }
  if (S.role === 'personal_trainer' && found.key === 'pt') { history.replaceState(null, '', '#/dashboard'); return route(); }
  let page;
  try { page = await found.fn(...found.args); } catch (e) { console.error(e); page = { title: 'Terjadi kesalahan', html: `<div class="note bad">${esc(errMsg(e))}</div>` }; }
  if (token !== renderToken) return;
  renderPage(page, found.key, false); Splash.hide();
}
function renderPage(page, key, bare) {

const clientOptions = sel => myClientsList().map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(clientName(c.id))}</option>`).join('');

/* ---------------- Baris sesi + aksi bersama ---------------- */
function sessionRow(s, o = {}) {
  const note = (s.status === 'cancelled' || s.status === 'no_show') ? `<span class="badge ${s.counts_toward_balance ? 'warn' : ''}">${s.counts_toward_balance ? 'Dihitung' : 'Tidak dihitung'}</span>` : '';
  const acts = [];
  if (canWrite()) {
    if (s.status === 'scheduled') acts.push(`<button class="btn primary lg" data-act="start" data-id="${s.id}">${ic('play', 'sm')} Mulai</button>`, `<button class="btn" data-act="decide" data-id="${s.id}">Batal / No-show</button>`, `<button class="icon-btn" data-act="edit" data-id="${s.id}" aria-label="Ubah sesi">${ic('edit')}</button>`);
    else if (s.status === 'check_in') acts.push(`<a class="btn primary lg" href="#/live/${s.id}">${ic('play', 'sm')} Lanjutkan</a>`);
    else if (isAdmin()) acts.push(`<button class="icon-btn" data-act="del" data-id="${s.id}" aria-label="Hapus sesi">${ic('trash')}</button>`);
  }
  const title = o.noClient ? (s.program_type || 'Sesi PT') : clientName(s.client_id);
  return `<div class="sx st-${s.status}"><div class="sx-time"><b>${esc(fmtTime(s.scheduled_at))}</b>${o.date ? `<small>${esc(fmtDate(s.scheduled_at))}</small>` : ''}</div>
    <div class="sx-main"><div class="sx-t">${esc(title)}</div><div class="sx-d"><span class="pgm">${ic(progIcon(s.program_type), 'sm')} ${esc(o.noClient ? 'Sesi PT' : (s.program_type || 'Sesi PT'))}</span>${s.location ? `<span>${esc(s.location)}</span>` : ''}</div>${s.count_reason ? `<div class="sx-d">Alasan: ${esc(s.count_reason)}</div>` : ''}</div>
    <div class="sx-r">${statusBadge(s.status)}${note}</div>
    ${acts.length ? `<div class="sx-a">${acts.join('')}</div>` : ''}</div>`;
}
function bindSessionActions(root) {
  root.addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const id = b.dataset.id, s = M.sessById[id]; if (!s) return;
    const a = b.dataset.act;
    if (a === 'start') {
      const r = await act(b, () => rpc('app_check_in_session', { p_session: id }), 'Sesi dimulai');
      if (r.ok) { await reload('sessions', 'packages'); go('#/live/' + id); }
    } else if (a === 'decide') decisionSheet(s);
    else if (a === 'edit') sessionFormSheet({ session: s });
    else if (a === 'del') {
      if (!await confirmDlg({ title: 'Hapus sesi?', message: 'Sesi dihapus permanen dan saldo paket dihitung ulang.', okText: 'Hapus', danger: true })) return;
      const r = await act(b, () => rpc('app_delete_session', { p_session: id }), 'Sesi dihapus');
      if (r.ok) { await reload('sessions', 'packages'); rerender(); }
    }
  });
}
/** Keputusan PT: batal / no-show, dihitung atau tidak, alasan wajib. */
function decisionSheet(s) {
  openSheet({
    title: 'Batal / No-show',
    body: `<p class="muted small" style="margin-bottom:10px">${esc(clientName(s.client_id))} · ${esc(fmtDT(s.scheduled_at))}</p>
    <form id="df" class="form"><div class="fld"><label>Kejadian</label><div class="seg" data-seg="status"><button type="button" class="on" data-v="cancelled">Dibatalkan</button><button type="button" data-v="no_show">No-show</button></div></div>
      <div class="fld"><label>Apakah sesi dihitung?</label><div class="seg" data-seg="counts"><button type="button" class="on" data-v="0">Tidak dihitung</button><button type="button" data-v="1">Dihitung (hangus)</button></div><span class="hint">Dihitung = mengurangi saldo paket / masuk tagihan.</span></div>
      <div class="fld"><label>Alasan (wajib)</label><textarea name="reason" required placeholder="mis. klien sakit, kabar H-1"></textarea></div></form>`,
    footer: '<button class="btn" data-close>Tutup</button><button class="btn primary" data-save>Simpan</button>',
    onMount(el, close) {
      const val = {}; $$('[data-seg]', el).forEach(g => { val[g.dataset.seg] = $('.on', g).dataset.v; g.addEventListener('click', ev => { const bt = ev.target.closest('button'); if (!bt) return; $$('button', g).forEach(x => x.classList.toggle('on', x === bt)); val[g.dataset.seg] = bt.dataset.v; }); });
      $('[data-save]', el).onclick = async ev => {
        const reason = $('[name=reason]', el).value.trim(); if (reason.length < 3) { toast('Alasan wajib diisi', 'err'); return; }
        const r = await act(ev.currentTarget, () => rpc('app_set_session_status', { p_session: s.id, p_status: val.status, p_counts: val.counts === '1', p_reason: reason }), 'Keputusan tersimpan');
        if (r.ok) { close(); await reload('sessions', 'packages'); rerender(); }
      };

}
function sessionFormSheet({ session, clientId, date }) {
  const edit = !!session;
  const cid = edit ? session.client_id : clientId || '';
  const dt = edit ? toLocalJakarta(session.scheduled_at) : `${date || todayYmd()}T08:00`;
  openSheet({
    title: edit ? 'Ubah sesi' : 'Jadwalkan sesi',
    body: `<form id="sf" class="form"><div class="fld"><label>Klien</label><select name="client" ${edit ? 'disabled' : ''} required><option value="">Pilih klien…</option>${clientOptions(cid)}</select></div>
      <div class="fld"><label>Paket</label><select name="pkg" required></select></div>
      <div class="fld"><label>Waktu (WIB)</label><input name="at" type="datetime-local" required value="${dt}"></div>
      <div class="grid2"><div class="fld"><label>Program</label><select name="prog">${PROGRAMS.map(p => `<option ${edit && session.program_type === p ? 'selected' : ''}>${p}</option>`).join('')}</select></div><div class="fld"><label>Lokasi</label><input name="loc" value="${esc(edit ? session.location || '' : '')}" placeholder="Gym / rumah"></div></div>
      <div class="fld"><label>Catatan</label><textarea name="notes">${esc(edit ? session.session_notes || '' : '')}</textarea></div></form>`,
    footer: '<button class="btn" data-close>Batal</button><button class="btn primary" data-save>Simpan</button>',
    onMount(el, close) {
      const f = $('#sf', el), selC = f.elements.client, selP = f.elements.pkg;
      const fill = () => { const list = activePkgs(selC.value).filter(p => isPostpaid(p) || remainingOf(p) > 0 || (edit && p.id === session.package_id)); selP.innerHTML = list.length ? list.map(p => `<option value="${p.id}" ${edit && p.id === session.package_id ? 'selected' : ''}>${esc(p.package_name)}${isPostpaid(p) ? ' (pascabayar)' : ' · sisa ' + remainingOf(p)}</option>`).join('') : '<option value="">Klien belum punya paket aktif</option>'; };
      selC.addEventListener('change', fill); fill();
      $('[data-save]', el).onclick = async ev => {
        if (!f.reportValidity() || !selP.value) { toast('Lengkapi klien, paket, dan waktu', 'err'); return; }
        const at = toIsoJakarta(f.elements.at.value);
        const r = await act(ev.currentTarget, () => edit
          ? rpc('app_update_session', { p_session: session.id, p_scheduled_at: at, p_program_type: f.elements.prog.value, p_location: f.elements.loc.value.trim() || null, p_notes: f.elements.notes.value.trim() || null })
          : rpc('app_schedule_session', { p_package: selP.value, p_scheduled_at: at, p_program_type: f.elements.prog.value, p_location: f.elements.loc.value.trim() || null, p_notes: f.elements.notes.value.trim() || null, p_status: 'scheduled' }),
          edit ? 'Sesi diperbarui' : 'Sesi dijadwalkan');
        if (r.ok) { close(); await reload('sessions', 'packages'); rerender(); }
      };
    },
  });
}

/* ---------------- Jadwal ---------------- */
async function pgJadwal(d) {
  const day = d || todayYmd(), ws = weekStart(day), days = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
  const names = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
  const mine = isClient() ? S.sessions.filter(s => s.client_id === S.clientId) : S.sessions;
  const byDay = x => mine.filter(s => ymd(s.scheduled_at) === x).sort((a, b) => a.scheduled_at.localeCompare(b.scheduled_at));
  const list = byDay(day);
  const hist = isClient() ? mine.filter(s => ymd(s.scheduled_at) < todayYmd()).sort((a, b) => b.scheduled_at.localeCompare(a.scheduled_at)).slice(0, 12) : [];
  return {
    title: isClient() ? 'Sesi' : 'Jadwal',
    html: `<div class="page-h"><div><h2>${isClient() ? 'Sesi saya' : 'Jadwal'}</h2><p>${esc(fmtDayLong(day))} · ${list.length} sesi${list.length ? ', ' + list.filter(x => x.status === 'completed').length + ' selesai' : ''}</p></div><div class="row gap-s"><button class="icon-btn" data-wk="-7" aria-label="Minggu lalu">${ic('back')}</button><button class="btn sm" data-wk="today">Hari ini</button><button class="icon-btn" data-wk="7" aria-label="Minggu depan">${ic('back').replace('<svg', '<svg style="transform:rotate(180deg)"')}</button></div></div>
      <div class="weekbar">${days.map((x, i) => `<button class="${x === day ? 'on' : ''}" data-day="${x}"><small>${names[i]}</small><b>${+x.slice(8)}</b>${byDay(x).length ? '<i></i>' : '<i style="opacity:0"></i>'}</button>`).join('')}</div>
      <div class="list" id="dl">${list.length ? list.map(s => sessionRow(s, { noClient: isClient() })).join('') : '<div class="empty"><b>Tidak ada sesi</b>Pilih hari lain atau jadwalkan sesi baru.</div>'}</div>
      ${hist.length ? `<div class="sec-h"><h3>Riwayat</h3></div><div class="list">${hist.map(s => sessionRow(s, { date: true, noClient: true })).join('')}</div>` : ''}`,
    fab: canWrite() ? `<button class="fab" data-new>${ic('plus')} Sesi</button>` : '',
    mount(v) {
      bindSessionActions(v);
      $$('[data-day]', v).forEach(b => b.onclick = () => go('#/jadwal/' + b.dataset.day));
      $$('[data-wk]', v).forEach(b => b.onclick = () => go('#/jadwal/' + (b.dataset.wk === 'today' ? todayYmd() : addDays(day, +b.dataset.wk))));
      const n = $('[data-new]', v); if (n) n.onclick = () => sessionFormSheet({ date: day });
    },
  };
}

      <div class="fld"><label>Nama paket</label><input name="name" required placeholder="Paket 10 Sesi"></div>
      <div class="grid2" id="pre"><div class="fld"><label>Jumlah sesi</label><input name="sessions" type="number" min="1" value="10" inputmode="numeric"></div><div class="fld"><label>Harga / sesi (Rp)</label><input name="price" type="number" min="0" inputmode="numeric" placeholder="300000"></div></div>

      $('#bt', el).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; bt = b.dataset.v; $$('#bt button', el).forEach(x => x.classList.toggle('on', x === b)); upd(); });

      };

/* ---------------- Sesi berjalan ---------------- */
async function pgLive(id) {
  const s = M.sessById[id];
  if (!s || !canWrite()) { go('#/jadwal'); return { title: '', html: '' }; }
  if (s.status !== 'check_in') return { title: 'Sesi', html: `<div class="empty"><b>Sesi ini ${s.status === 'completed' ? 'sudah selesai' : 'tidak sedang berjalan'}</b><a class="btn" href="#/jadwal">Ke jadwal</a></div>` };
  const started = new Date(s.check_in_at || s.updated_at || Date.now()).getTime();
  const C = 2 * Math.PI * 105;
  const RPE = [[1, 'Ringan'], [2, 'Sedang'], [3, 'Berat'], [4, 'Sangat berat'], [5, 'Maksimal']];
  const QN = ['Beban naik', 'Teknik perlu koreksi', 'Tenaga bagus', 'Cepat lelah', 'Ada keluhan sendi'];
  return {
    title: 'Sesi berjalan',
    html: `<div class="live2"><div class="lv-head"><div class="fx3d" id="kb"></div><div class="eyebrow on">${ic('pulse', 'sm')} Sesi berjalan</div><h2>${esc(clientName(s.client_id))}</h2><span class="pgm">${ic(progIcon(s.program_type), 'sm')} ${esc(s.program_type || 'Sesi PT')}${s.location ? ' · ' + esc(s.location) : ''}</span></div>
      <div class="timer"><svg viewBox="0 0 230 230"><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--fx1)"/><stop offset="1" style="stop-color:var(--brand)"/></linearGradient></defs><circle cx="115" cy="115" r="105" fill="none" stroke="var(--line)" stroke-width="12"/><circle id="ring" cx="115" cy="115" r="105" fill="none" stroke="url(#tg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="tm" id="tm">00:00</div><small class="tmsub">dari 60 menit</small></div>
      <div class="card lvc"><div class="fld"><label>Catatan sesi</label><div class="qn" id="qn">${QN.map(q => `<button type="button" class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div><textarea id="ln" placeholder="Beban, progres, catatan teknik…">${esc(s.session_notes || '')}</textarea></div>
        <div class="fld"><label>Seberapa berat sesinya? (RPE)</label><div class="rpe" id="rpe">${RPE.map(([n, l]) => `<button type="button" data-v="${n}"><b>${n}</b><small>${l}</small></button>`).join('')}</div></div></div>
      <div class="lv-bar"><button class="btn primary lg block" id="fin">${ic('check')} Selesaikan sesi</button><a class="btn block" href="#/jadwal">Kembali (sesi tetap berjalan)</a></div></div>`,
    mount(v) {
      FX.attach($('#kb', v), 'body-live');
      let rpeV = null; const tm = $('#tm', v), ring = $('#ring', v);
      const tick = () => { if (!tm.isConnected) return; const sec = Math.max(0, Math.floor((Date.now() - started) / 1000)); tm.textContent = `${String(Math.floor(sec / 3600) ? Math.floor(sec / 3600) + ':' : '')}${String(Math.floor(sec % 3600 / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`; ring.style.strokeDashoffset = C * (1 - Math.min(sec / 3600, 1)); setTimeout(tick, 1000); };
      tick();
      $('#qn', v).addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (!b) return; const t = $('#ln', v); t.value = (t.value.trim() ? t.value.trim() + '. ' : '') + b.dataset.q; t.focus(); });
      $('#rpe', v).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; rpeV = +b.dataset.v; $$('#rpe button', v).forEach(x => x.classList.toggle('on', x === b)); });
      $('#fin', v).onclick = async ev => {
        if (!rpeV) { toast('Pilih RPE dahulu', 'err'); return; }
        const r = await act(ev.currentTarget, () => rpc('app_complete_session', { p_session: id, p_rpe: rpeV, p_notes: $('#ln', v).value.trim() || null }), 'Sesi selesai');
        if (r.ok) { await reload('sessions', 'packages'); go('#/jadwal'); }
      };
    },
  };
}

'use strict';
/* ======================= Halaman: Pembayaran, Kuitansi, Pengaturan ======================= */
const PAYSTATE = { tab: null, pkg: '', month: null };
const BUCKET = 'payment-proofs';
const payTabs = () => isAdmin() ? [['recon', 'Tagihan'], ['reports', 'Laporan PT'], ['record', 'Catat bayar'], ['trx', 'Transaksi'], ['banks', 'Rekening']]
  : isPT() ? [['recon', 'Tagihan'], ['report', 'Lapor bayar'], ['myrep', 'Laporan saya'], ['banks', 'Rekening']]
    : [['recon', 'Tagihan'], ['trx', 'Riwayat'], ['banks', 'Cara bayar']];
const REP = { pending: ['Menunggu', 'warn'], confirmed: ['Dikonfirmasi', 'ok'], rejected: ['Ditolak', 'bad'] };
const trxLabel = t => t.voided_at ? '<span class="badge bad">Void</span>' : t.kind === 'refund' ? '<span class="badge">Refund</span>' : '<span class="badge ok">Lunas</span>';
const payablePkgs = () => S.packages.filter(p => p.is_active !== false && M.client[p.client_id] && (isPostpaid(p) || outstandingOf(p) > 0 || true));
const pkgLabel = p => `${clientName(p.client_id)} — ${p.package_name}${isPostpaid(p) ? ' (pascabayar)' : ' · sisa ' + rp(outstandingOf(p))}`;
const pkgOptions = sel => payablePkgs().map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(pkgLabel(p))}</option>`).join('');

async function signedUrl(path) { const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 300); if (error) throw error; return data.signedUrl; }

async function pgPayments() {
  const tabs = payTabs(); if (!PAYSTATE.tab || !tabs.some(t => t[0] === PAYSTATE.tab)) PAYSTATE.tab = 'recon';
  const month = PAYSTATE.month || ym(new Date()); const tab = PAYSTATE.tab;
  let body = '';
  if (tab === 'recon') body = tabRecon(month);
  else if (tab === 'reports') body = tabReports();
  else if (tab === 'record') body = tabRecord(month);
  else if (tab === 'trx') body = tabTrx();
  else if (tab === 'report') body = tabReport(month);
  else if (tab === 'myrep') body = tabMyReports();
  else if (tab === 'banks') body = tabBanks();
  const pend = S.reports.filter(r => r.status === 'pending').length;
  return {
    title: isClient() ? 'Tagihan' : 'Pembayaran',
    html: `<div class="page-h"><div><h2>${isClient() ? 'Tagihan' : 'Pembayaran'}</h2><p>${isAdmin() ? 'Catat, konfirmasi, dan rekonsiliasi' : isPT() ? 'Laporkan pembayaran klien ke Admin' : 'Rincian tagihan dan riwayat bayar'}</p></div></div>

    mount(v) {

      mountTab(v, tab, month);
    },
  };
}

function bankSheet(b) {
  openSheet({
    title: b ? 'Ubah rekening' : 'Rekening baru',
    body: `<form id="bf" class="form"><div class="fld"><label>Personal Trainer</label><select name="tr" required>${trainerOptions(b ? b.trainer_id : '')}</select></div><div class="fld"><label>Bank</label><input name="bank" required value="${esc(b ? b.bank_name : '')}" placeholder="BCA"></div><div class="fld"><label>Nomor rekening</label><input name="no" required inputmode="numeric" value="${esc(b ? b.account_number : '')}"></div><div class="fld"><label>Atas nama</label><input name="holder" required value="${esc(b ? b.account_holder : '')}"></div><label class="check"><input type="checkbox" name="active" ${!b || b.is_active !== false ? 'checked' : ''}> Aktif</label></form>`,

    onMount(el, close) {
      $('[data-save]', el).onclick = async ev => {

        const r = await act(ev.currentTarget, async () => { const q = b ? sb.from('pt_bank_accounts').update(row).eq('id', b.id) : sb.from('pt_bank_accounts').insert(row); const { error } = await q; if (error) throw error; await reload('banks'); }, 'Rekening disimpan');

function mountTab(v, tab, month) {
  if (tab === 'reports') {
    v.addEventListener('click', async e => {
      const p = e.target.closest('[data-proof]'), c = e.target.closest('[data-confirm]'), x = e.target.closest('[data-reject]');
      if (p) { const r = await act(p, async () => { const u = await signedUrl(p.dataset.proof); openSheet({ title: 'Bukti transfer', body: `<img src="${esc(u)}" alt="Bukti transfer" style="width:100%;border-radius:12px">`, wide: true }); }); }
      else if (c) { if (!await confirmDlg({ title: 'Konfirmasi pembayaran?', message: 'Pembayaran dicatat dan kuitansi diterbitkan.', okText: 'Konfirmasi' })) return; const r = await act(c, () => rpc('app_confirm_payment_report', { p_id: c.dataset.confirm }), 'Pembayaran dikonfirmasi'); if (r.ok) { await reload('reports', 'trx', 'packages'); rerender(); } }
      else if (x) {
        openSheet({ title: 'Tolak laporan', body: '<div class="fld"><label>Alasan (wajib)</label><textarea id="rr"></textarea></div>', footer: '<button class="btn" data-close>Batal</button><button class="btn danger" data-save>Tolak</button>',
          onMount(el, close) { $('[data-save]', el).onclick = async ev => { const reason = $('#rr', el).value.trim(); if (!reason) { toast('Alasan wajib diisi', 'err'); return; } const r = await act(ev.currentTarget, () => rpc('app_reject_payment_report', { p_id: x.dataset.reject, p_reason: reason }), 'Laporan ditolak'); if (r.ok) { close(); await reload('reports'); rerender(); } }; } });
      }
    });
  }
  if (tab === 'trx') v.addEventListener('click', e => {
    const b = e.target.closest('[data-void]'); if (!b) return;
    openSheet({ title: 'Void transaksi', body: '<p class="muted small" style="margin-bottom:10px">Transaksi tidak dihapus, hanya ditandai void dan saldo paket dihitung ulang.</p><div class="fld"><label>Alasan (wajib)</label><textarea id="vr"></textarea></div>', footer: '<button class="btn" data-close>Batal</button><button class="btn danger" data-save>Void</button>',
      onMount(el, close) { $('[data-save]', el).onclick = async ev => { const reason = $('#vr', el).value.trim(); if (!reason) { toast('Alasan wajib diisi', 'err'); return; } const r = await act(ev.currentTarget, () => rpc('app_void_transaction', { p_id: b.dataset.void, p_reason: reason }), 'Transaksi di-void'); if (r.ok) { close(); await reload('trx', 'packages'); rerender(); } }; } });
  });
  if (tab === 'banks') {
    v.addEventListener('click', async e => {
      const cp = e.target.closest('[data-copy]'), ed = e.target.closest('[data-bedit]'), dl = e.target.closest('[data-bdel]'), ad = e.target.closest('[data-badd]');
      if (cp) { try { await navigator.clipboard.writeText(cp.dataset.copy); toast('Nomor disalin'); } catch { toast(cp.dataset.copy); } }
      else if (ad) bankSheet(null); else if (ed) bankSheet(S.banks.find(b => b.id === ed.dataset.bedit));
      else if (dl) { if (!await confirmDlg({ title: 'Hapus rekening?', message: 'Rekening dihapus permanen.', okText: 'Hapus', danger: true })) return; const r = await act(dl, async () => { const { error } = await sb.from('pt_bank_accounts').delete().eq('id', dl.dataset.bdel); if (error) throw error; await reload('banks'); }, 'Rekening dihapus'); if (r.ok) rerender(); }
    });
  }
  const f = $('#rf', v); if (!f) return;
  const sel = f.elements.pkg, mw = $('#mwrap', f), amt = f.elements.amount;
  const sync = () => { const p = M.pkg[sel.value]; mw.hidden = !(p && isPostpaid(p)); if (p && !amt.value) { const out = isPostpaid(p) ? monthBilling(p, f.elements.month.value || month).outstanding : outstandingOf(p); if (out > 0) amt.value = out; } };
  sel.addEventListener('change', () => { amt.value = ''; sync(); }); f.elements.month.addEventListener('change', () => { amt.value = ''; sync(); });
  if (PAYSTATE.pkg) { sel.value = PAYSTATE.pkg; PAYSTATE.pkg = ''; sync(); }
  f.addEventListener('submit', async e => {
    e.preventDefault(); const btn = $('button', f), p = M.pkg[sel.value]; const pm = p && isPostpaid(p) ? f.elements.month.value : null;
    if (isAdmin()) {
      const r = await act(btn, () => rpc('app_record_payment', { p_package: sel.value, p_amount: +amt.value, p_notes: f.elements.notes.value.trim() || null, p_month: pm }), 'Pembayaran dicatat');
      if (r.ok) { await reload('trx', 'packages'); toast('Kuitansi ' + (r.data && r.data.receipt_number || '') + ' diterbitkan'); PAYSTATE.tab = 'trx'; rerender(false); }
    } else {
      const file = f.elements.proof.files[0]; if (!file) { toast('Unggah foto bukti', 'err'); return; }
      if (file.size > 8 * 1024 * 1024) { toast('Foto maksimal 8 MB', 'err'); return; }
      const r = await act(btn, async () => {
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'jpg';
        const path = `${S.me.id}/${uuid()}.${ext}`;
        const up = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || 'image/jpeg', upsert: false }); if (up.error) throw up.error;
        await rpc('app_submit_payment_report', { p_package: sel.value, p_amount: +amt.value, p_proof_path: path, p_notes: f.elements.notes.value.trim() || null, p_period_month: pm });
        await reload('reports');
      }, 'Laporan terkirim ke Admin');
      if (r.ok) { PAYSTATE.tab = 'myrep'; rerender(false); }
    }
  });
}

/* ======================= Tampilan 3D ringan: bentuk melayang, tilt kartu, animasi masuk ======================= */
(function () {
  try {
    const s = document.createElement('div'); s.className = 'nb-shapes'; s.setAttribute('aria-hidden', 'true'); s.innerHTML = '<i></i><i></i><i></i><i></i>'; document.body.prepend(s);
    const setFx = () => { document.body.dataset.fx = (typeof FX !== 'undefined' && FX.label() === 'Hemat') ? 'lite' : 'full'; };
    setFx(); window.__setFx = setFx;
    const SEL = '.hero,.kpi,.card,.item';
    const fine = matchMedia('(hover:hover) and (pointer:fine)').matches, reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
    const lite = () => document.body.dataset.fx === 'lite';
    let cur = null;
    const reset = t => { if (!t) return; t.style.transform = ''; t.classList.remove('tilting'); };
    document.addEventListener('pointermove', e => {
      if (!fine || reduce || lite() || e.pointerType === 'touch') return;
      const t = e.target.closest && e.target.closest(SEL);
      if (cur && cur !== t) reset(cur);
      cur = t; if (!t || t.closest('.overlay,.auth')) return;
      const r = t.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      const m = t.classList.contains('hero') ? 9 : (r.width > 500 ? 2.5 : 7);
      t.style.setProperty('--mx', (x * 100).toFixed(0) + '%'); t.style.setProperty('--my', (y * 100).toFixed(0) + '%');
      t.style.transform = `perspective(900px) rotateX(${((.5 - y) * m).toFixed(2)}deg) rotateY(${((x - .5) * m).toFixed(2)}deg) translateZ(6px)`;
      t.classList.add('tilting');
    }, { passive: true });
    document.addEventListener('pointerout', e => { if (cur && !cur.contains(e.relatedTarget)) { reset(cur); cur = null; } }, { passive: true });
    document.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'touch' || lite()) return;
      const t = e.target.closest && e.target.closest(SEL); if (!t) return;
      const r = t.getBoundingClientRect(); t.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(0) + '%'); t.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(0) + '%');
      t.classList.add('tilting'); setTimeout(() => t.classList.remove('tilting'), 450);
    }, { passive: true });
    /* animasi masuk tiap halaman berganti */
    const app = document.getElementById('app'); let lastKey = '';
    if (app) new MutationObserver(() => {
      const v = document.getElementById('view'); if (!v) return;
      const k = location.hash.split('?')[0]; if (k === lastKey) return; lastKey = k;
      v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); setTimeout(() => v.classList.remove('enter'), 900);
    }).observe(app, { childList: true });
    window.addEventListener('hashchange', () => { lastKey = ''; });
  } catch (_) { }
})();

</script>
